<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 96 1200 288" width="1200" height="288" role="img" aria-label="AI-DLC Studio — Action Center over five phase lanes">
  <title>AI-DLC Studio</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12141a"/><stop offset="1" stop-color="#181b22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d492" stop-opacity=".55"/><stop offset="1" stop-color="#00d492" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#glow)"/>
  <!-- queue column -->
  <rect x="64" y="96" width="360" height="484" rx="12" fill="#1a1d25" stroke="#27272a"/>
  <rect x="88" y="124" width="312" height="52" rx="8" fill="#181b22" stroke="#00d492" stroke-opacity=".55"/>
  <rect x="104" y="140" width="8" height="20" rx="4" fill="#00d492"/>
  <rect x="124" y="140" width="150" height="8" rx="4" fill="#fafafa" fill-opacity=".85"/>
  <rect x="124" y="154" width="210" height="6" rx="3" fill="#7f7f88"/>
  <g fill="#181b22" stroke="#27272a">
    <rect x="88" y="188" width="312" height="52" rx="8"/><rect x="88" y="252" width="312" height="52" rx="8"/>
    <rect x="88" y="316" width="312" height="52" rx="8"/><rect x="88" y="380" width="312" height="52" rx="8"/>
    <rect x="88" y="444" width="312" height="52" rx="8"/>
  </g>
  <g fill="#7f7f88">
    <rect x="124" y="206" width="170" height="7" rx="3.5"/><rect x="124" y="222" width="120" height="6" rx="3"/>
    <rect x="124" y="270" width="150" height="7" rx="3.5"/><rect x="124" y="286" width="190" height="6" rx="3"/>
    <rect x="124" y="334" width="185" height="7" rx="3.5"/><rect x="124" y="350" width="100" height="6" rx="3"/>
    <rect x="124" y="398" width="140" height="7" rx="3.5"/><rect x="124" y="414" width="160" height="6" rx="3"/>
    <rect x="124" y="462" width="165" height="7" rx="3.5"/><rect x="124" y="478" width="130" height="6" rx="3"/>
  </g>
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <rect x="104" y="196" width="8" height="20" rx="4" fill="#eab308" stroke="none"/>
    <rect x="104" y="260" width="8" height="20" rx="4" fill="#eab308" stroke="none"/>
    <rect x="104" y="324" width="8" height="20" rx="4" fill="#0891b2" stroke="none"/>
    <rect x="104" y="388" width="8" height="20" rx="4" fill="#ef4444" stroke="none"/>
    <rect x="104" y="452" width="8" height="20" rx="4" fill="#7f7f88" stroke="none"/>
  </g>
  <!-- decision pane -->
  <rect x="456" y="96" width="680" height="484" rx="12" fill="#1a1d25" stroke="#27272a"/>
  <rect x="488" y="128" width="300" height="12" rx="6" fill="#fafafa" fill-opacity=".9"/>
  <rect x="488" y="156" width="420" height="8" rx="4" fill="#7f7f88"/>
  <g fill="#181b22" stroke="#27272a">
