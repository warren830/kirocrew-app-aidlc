  <g fill="#7f7f88">
    <rect x="512" y="216" width="180" height="8" rx="4"/><rect x="512" y="236" width="520" height="6" rx="3"/>
    <rect x="512" y="252" width="470" height="6" rx="3"/><rect x="512" y="268" width="380" height="6" rx="3"/>
    <rect x="512" y="344" width="150" height="8" rx="4"/><rect x="512" y="364" width="540" height="6" rx="3"/>
    <rect x="512" y="380" width="440" height="6" rx="3"/><rect x="512" y="396" width="500" height="6" rx="3"/>
  </g>
  <rect x="488" y="192" width="4" height="112" rx="2" fill="#22c55e"/>
  <rect x="488" y="320" width="4" height="112" rx="2" fill="#eab308"/>
  <!-- sticky action bar -->
  <rect x="456" y="500" width="680" height="80" rx="12" fill="#181b22" stroke="#27272a"/>
  <rect x="488" y="524" width="150" height="32" rx="8" fill="#00d492"/>
  <rect x="520" y="536" width="86" height="8" rx="4" fill="#12141a"/>
  <rect x="656" y="524" width="190" height="32" rx="8" fill="#1a1d25" stroke="#3f3f46"/>
  <rect x="684" y="536" width="134" height="8" rx="4" fill="#e4e4e7"/>
  <rect x="960" y="536" width="144" height="8" rx="4" fill="#7f7f88"/>
  <!-- five phase lanes as a footer signature -->
  <g stroke-linecap="round" stroke-width="6">
    <path d="M64 624h190" stroke="#00d492" stroke-opacity=".85"/>
    <path d="M274 624h190" stroke="#00d492" stroke-opacity=".65"/>
    <path d="M484 624h190" stroke="#00d492" stroke-opacity=".5"/>
    <path d="M694 624h190" stroke="#00d492" stroke-opacity=".35"/>
    <path d="M904 624h232" stroke="#00d492" stroke-opacity=".2"/>
