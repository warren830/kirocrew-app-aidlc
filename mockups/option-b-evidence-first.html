  });
  if(!items.length) out = `<div class="empty">${ico('i-check','ico-lg')}<div class="et">Nothing needs your judgment</div>
    <div style="font-size:12.5px">Two intents are running unattended. The next stop will be a Gate in <span class="mono">checkout-web</span>.</div>
    <button class="btn btn-sm" style="margin-top:12px" data-route="map">${ico('i-map','ico-sm')}Watch the Workflow Map</button></div>`;

  return `<aside class="queue" aria-label="Action queue">
    <div class="queue-head">
      <div class="queue-title"><h2>Needs you</h2><span class="n">${items.length} of ${ACTIONS.length}</span></div>
      <label class="search">${ico('i-search','ico-sm')}<input id="qSearch" type="search" placeholder="Filter by repo, intent, stage" value="${esc(S.query)}" aria-label="Filter the queue"></label>
      <div class="seg" role="group" aria-label="Queue organization">
        ${['priority','repo','type','oldest'].map(k=>`<button data-order="${k}" aria-pressed="${S.order===k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}
      </div>
    </div>
    <div class="queue-list">${out}</div>
  </aside>`;
}
function parseWait(w){ const m=/(?:(\d+)h)?\s*(?:(\d+)m)?/.exec(w)||[]; return (+(m[1]||0))*60 + (+(m[2]||0)); }

/* ===================== detail shell ===================== */
const TABS = [
  {id:'decision', label:'Decision', icon:'i-inbox'},
  {id:'artifacts', label:'Artifacts', icon:'i-doc'},
  {id:'review', label:'Review', icon:'i-review'},
  {id:'activity', label:'Activity', icon:'i-activity'}
];
function detailHTML(){
  const a = act(S.sel);
  if(!a) return `<section class="detail"><div class="empty">${ico('i-inbox','ico-lg')}<div class="et">Select an item</div><div style="font-size:12.5px">Pick anything in the queue to see its evidence.</div></div></section>`;

  const tabCounts = {artifacts: a.artifact?1:(a.drift?a.drift.length:0), review: a.findings?a.findings.length:0, activity:4};
  const tabs = TABS.filter(t=>{
    if(t.id==='artifacts') return !!(a.artifact||a.drift||a.evidence);
    if(t.id==='review')    return !!a.findings;
    return true;
  }).map(t=>`<button role="tab" data-tab="${t.id}" aria-selected="${S.tab===t.id}">${ico(t.icon,'ico-sm')}${t.label}${tabCounts[t.id]?`<span class="tc">${tabCounts[t.id]}</span>`:''}</button>`).join('');

  return `<section class="detail">
    <div class="detail-head">
      <div class="dbreadcrumb">${ico(a.icon,'ico-sm')}<span>${esc(a.typeLabel)}</span><span class="sep">/</span>
        <span>${esc(a.repo)}</span><span class="sep">/</span><span>${esc(a.intent)}</span><span class="sep">/</span><span>${esc(a.stage)}</span>
        <button class="anchor-link" data-copy="deeplink" title="Copy deep link">${ico('i-link','ico-sm')}deep link</button></div>
      <h1 class="dtitle">${esc(a.title)}</h1>
      <div class="dfacts">
        ${sevChip(a.sev)}
        <span class="chip">${ico('i-clock')}waiting ${esc(a.wait)}</span>
        ${a.reviewClass?`<span class="chip chip-info">${ico('i-review')}${esc(a.reviewClass)} review</span>`:''}
        ${a.agent?`<span class="chip">${ico('i-intent')}agent ${esc(a.agent)}</span>`:''}
        ${a.revision?`<span class="chip">revision ${a.revision}</span>`:''}
        <span class="chip mono" style="font-size:11px">${esc(a.id)}</span>
      </div>
      <div class="tabs" role="tablist">${tabs}</div>
    </div>
    <div class="detail-body"><div class="reading">${bodyHTML(a)}</div></div>
    ${S.confirm ? confirmHTML(a) : ''}
    ${actionbarHTML(a)}
  </section>`;
}
function sevChip(sev){
  const map={critical:['chip-danger','i-recovery','Recovery required'],blocking:['chip-accent','i-gate','Blocking'],attention:['chip-warn','i-warn','Needs attention'],info:['chip','i-info','Informational']};
  const [c,i,l]=map[sev]; return `<span class="chip ${c}">${ico(i)}${l}</span>`;
}

/* delivery strip shared by every template */
function deliveryHTML(a){
  const steps=['Queued','Delivered','Agent processing','State changed'];
  const sentIdx = S.sent[a.id];
  let now = sentIdx!==undefined ? sentIdx : ({delivered:1,uncertain:1,failed:1,blocked:0,held:0}[a.delivery] ?? 0);
  const uncertain = a.delivery==='uncertain' && sentIdx===undefined;
  return `<div class="delivery" role="group" aria-label="Delivery state">
    ${steps.map((s,i)=>`${i?'<span class="dsep"></span>':''}
      <span class="dstep ${i<now?'done':(i===now?'now':'')}">
        <span class="b">${i<now?ico('i-check','ico-sm'):(i===now?ico('i-clock','ico-sm'):'')}</span>${s}</span>`).join('')}
    ${uncertain?`<span class="chip chip-danger" style="margin-left:12px">${ico('i-warn')}Delivery uncertain &mdash; not replayed automatically</span>`:''}
    ${sentIdx!==undefined?`<span class="chip chip-ok" style="margin-left:12px">${ico('i-check')}Studio is watching disk state, not the HTTP receipt</span>`:''}
  </div>`;
}

/* ===================== sticky action bar ===================== */
function actionbarHTML(a){
  const sent = S.sent[a.id]!==undefined;
  if(sent) return `<div class="actionbar"><span class="hint">${ico('i-check','ico-sm')}Submitted as <span class="mono">${esc(a.id)}</span>. The item clears only after AI-DLC state moves (FR-ACT-007).</span>
    <button class="btn" data-act="undo">Show the queue</button></div>`;
  const H = t=>`<span class="hint">${ico('i-info','ico-sm')}${t}</span>`;
  switch(a.type){
    case 'gate': return `<div class="actionbar">${H('Approve opens an inline confirmation showing the exact text sent.')}
      <button class="btn" data-act="advisor">${ico('i-advisor','ico-sm')}Ask the Advisor</button>
      <button class="btn btn-danger" data-act="reject">Request changes</button>
      <button class="btn btn-primary" data-act="approve">${ico('i-check','ico-sm')}Approve</button></div>`;
    case 'questions': {
      const need = a.questions.filter(q=>q.required && !answered(a,q)).length;
      return `<div class="actionbar">${H(need?`${need} required answer${need>1?'s':''} still missing &mdash; all three send as one action.`:'All required answers present. One atomic submit.')}
        <button class="btn" data-act="draftall">${ico('i-advisor','ico-sm')}Draft all</button>
        <button class="btn btn-primary" data-act="answers" ${need?'disabled':''}>${ico('i-send','ico-sm')}Send answers</button></div>`;
    }
    case 'recovery': return `<div class="actionbar">${H('No transition happens until you choose. Studio never picks a convenient source of truth.')}
      <button class="btn" data-act="advisor">${ico('i-advisor','ico-sm')}Diagnose with AI</button>
      <button class="btn btn-primary" data-act="recovery">${ico('i-check','ico-sm')}Apply the selected recovery</button></div>`;
    case 'failure': return `<div class="actionbar">${H('Retry now resets the fingerprint count for this intent.')}
      <button class="btn" data-act="advisor">${ico('i-advisor','ico-sm')}Diagnose with AI</button>
      <button class="btn">${ico('i-pause','ico-sm')}Keep paused</button>
      <button class="btn btn-primary" data-act="retry">${ico('i-play','ico-sm')}Retry now</button></div>`;
    case 'install': return `<div class="actionbar">${H('There is no overwrite shortcut. The 2.3.0 installation stays complete.')}
      <button class="btn">${ico('i-doc','ico-sm')}Open the receipt</button>
      <button class="btn btn-primary">Re-run the upgrade preview</button></div>`;
    default: return `<div class="actionbar">${H('Budgets never interrupt a running turn; they only prevent the next dispatch.')}
      <button class="btn">Raise the turn cap</button>
      <button class="btn btn-primary" data-act="retry">${ico('i-play','ico-sm')}Run to next checkpoint</button></div>`;
  }
}
function answered(a,q){
  const v = S.answers[a.id+'/'+q.id];
  return q.multi ? (Array.isArray(v)&&v.length>0) : !!v;
}

/* ===================== inline confirmation (FR-GATE-001) ===================== */
function confirmHTML(a){
  const C = S.confirm;
  let text='', head='', warn='';
  if(C==='approve'){ head='Confirm the exact text sent to the canonical session'; text=a.approveText; }
  if(C==='reject'){
    head='Confirm the change request sent to the canonical session';
    text = `Request changes\n\n${S.feedback.trim()}`;
    if(!S.feedback.trim()) warn='Feedback cannot be blank.';
  }
  if(C==='answers'){
    head='Confirm the answer group sent as one action';
    text = a.questions.map((q,i)=>{
      const v=S.answers[a.id+'/'+q.id];
      const lbl = Array.isArray(v) ? v.map(id=>q.opts.find(o=>o.id===id)?.l||id).join(', ')
                 : (v==='__other' ? 'Other: '+(S.answers[a.id+'/'+q.id+'/other']||'').trim() : (q.opts.find(o=>o.id===v)?.l||'(no answer)'));
      return `${i+1}. ${q.prompt}\n   ${lbl}`;
    }).join('\n');
  }
  if(C==='recovery'){
    const ch=a.choices.find(c=>c.id===S.recoveryChoice);
    head='Confirm the recovery you selected'; text=ch.label;
  }
  return `<div class="confirm" role="group" aria-label="Confirmation">
    <div class="ch">${ico('i-send','ico-sm')}${head}</div>
    <div class="sendtext">${esc(text)}</div>
    <div class="route">${ico('i-info','ico-sm')}<span>Injected as a real user turn into canonical session
      <span class="mono">ses_${a.id.replace('a-','')}c4</span> for <span class="mono">${esc(a.repo)}/${esc(a.intent)}</span>.
      The Kiro <span class="mono">userPromptSubmit</span> hook mints the protected <span class="mono">HUMAN_TURN</span>; the AI-DLC engine commits the transition.
      Studio does not call <span class="mono">report</span>, edit <span class="mono">aidlc-state.md</span>, or set any bypass variable.</span></div>
    ${warn?`<div class="route" style="color:var(--danger)">${ico('i-warn','ico-sm')}${warn}</div>`:''}
    <div class="confirm-actions">
      <button class="btn btn-primary" data-act="send" ${warn?'disabled':''}>${ico('i-check','ico-sm')}Yes, send this exact text</button>
      <button class="btn" data-act="cancel">Cancel</button>
      <span class="hint" style="font-size:11.5px;color:var(--muted)">At-most-once: after this point Studio will reconcile rather than resend.</span>
    </div>
  </div>`;
}
</script>

<script>
/* ===================== tab bodies ===================== */
function bodyHTML(a){
  if(S.tab==='artifacts') return artifactsTab(a);
  if(S.tab==='review')    return reviewTab(a);
  if(S.tab==='activity')  return activityTab(a);
  return decisionTab(a);
}
const B=(title,icon,inner)=>`<section class="block"><h3>${icon?ico(icon,'ico-sm'):''}${title}</h3>${inner}</section>`;

function decisionTab(a){
  let out = deliveryHTML(a);
  out += B('Decision brief','i-inbox', `<div class="brief"><p>${esc(a.lede)}</p>
    <div class="consequence">${ico('i-info','ico-sm')}<span><b>Next consequence.</b> ${esc(a.consequence)}</span></div></div>`);

  if(a.criteria) out += B('Stage acceptance criteria &mdash; '+a.criteria.filter(c=>c.met).length+' of '+a.criteria.length+' met','i-check',
    `<ul class="crit">${a.criteria.map(c=>`<li>${ico(c.met?'i-check':'i-warn', 'ico-sm '+(c.met?'met':'unmet'))}
      <span class="txt">${esc(c.txt)}<span class="why">${esc(c.why)}</span></span></li>`).join('')}</ul>`);

  if(a.type==='gate') out += B('Artifact and reviewer, side by side','i-review', compareHTML(a)) +
    B('Unresolved risks','i-warn', `<ul class="crit">${a.risks.map(r=>`<li>${ico('i-warn','ico-sm unmet')}<span class="txt">${esc(r)}</span></li>`).join('')}</ul>`);

  if(a.type==='questions') out += B('Question group &mdash; answered together','i-question', questionsHTML(a));

  if(a.type==='recovery'){
    out += B('Last stable boundary','i-clock', `<div class="ev"><div class="src">${ico('i-check','ico-sm')}Boundary</div>
      <div class="val">${esc(a.boundary.stage)} &middot; ${esc(a.boundary.marker)}</div>
      <div class="sub">Recorded at ${esc(a.boundary.at)}. Context can be reconstructed from disk at this point.</div></div>`);
    out += B('Evidence from every source','i-doc', `<div class="evgrid">${a.evidence.map(e=>`
      <div class="ev" data-conflict="${!!e.conflict}"><div class="src">${ico(e.icon,'ico-sm')}${esc(e.src)}${e.conflict?' &middot; conflict':''}</div>
      <div class="val">${esc(e.val)}</div><div class="sub">${esc(e.sub)}</div></div>`).join('')}</div>`);
    out += B('The contradiction','i-warn', `<div class="brief" style="border-left-color:var(--danger)"><p>${esc(a.contradiction)}</p></div>`);
    out += B('Recovery choices','i-recovery', a.choices.map(c=>`
      <label class="choice ${S.recoveryChoice===c.id?'sel':''}">
        <input type="radio" name="rec" value="${c.id}" ${S.recoveryChoice===c.id?'checked':''}>
        <span><span class="cl">${esc(c.label)}${c.rec?' <span class="chip chip-ok" style="margin-left:6px">Advisor recommends</span>':''}</span>
        <span class="cd">${esc(c.desc)}</span></span></label>`).join(''));
  }

  if(a.type==='failure'){
    out += B('Normalized error','i-fail', `<div class="brief" style="border-left-color:var(--danger)">
      <p>${esc(a.errorSummary)}</p><p class="mono" style="font-size:12.5px;color:var(--muted)">fingerprint ${esc(a.fingerprint)}</p></div>`);
    out += B('Retry and backoff history','i-clock', `<table class="tbl"><thead><tr><th>#</th><th>At</th><th>Backoff</th><th>Outcome</th></tr></thead>
      <tbody>${a.retries.map(r=>`<tr><td class="mono">${r.n}</td><td class="mono">${r.at}</td><td class="mono">${r.wait}</td><td>${esc(r.out)}</td></tr>`).join('')}</tbody></table>`);
    out += B('Session log excerpt','i-activity', `<div class="pane"><div class="pane-body"><pre class="mono" style="margin:0;font-size:11.5px;white-space:pre-wrap">${esc(a.logs)}</pre></div></div>
      <div class="consequence" style="margin-top:12px">${ico('i-info','ico-sm')}<span>${esc(a.note)}</span></div>`);
  }

  if(a.type==='install'){
    out += B('Receipt ownership','i-lock', `<div class="evgrid">
      <div class="ev"><div class="src">${ico('i-doc','ico-sm')}Installed engine</div><div class="val">${esc(a.receipt.version)}</div><div class="sub">receipt written ${esc(a.receipt.at)}</div></div>
      <div class="ev"><div class="src">${ico('i-install','ico-sm')}Bundled with Studio</div><div class="val">2.4.1</div><div class="sub">Studio ${esc(a.receipt.studio)}</div></div>
      <div class="ev"><div class="src">${ico('i-doc','ico-sm')}Managed files</div><div class="val">${a.receipt.files} exact</div><div class="sub">each recorded with version, path and SHA-256</div></div></div>`);
    out += B('Managed-file drift','i-git', `<table class="tbl"><thead><tr><th>Path</th><th>Ownership</th><th>State</th><th>Hash</th></tr></thead><tbody>
      ${a.drift.map(d=>`<tr><td class="mono wrap-any">${esc(d.path)}</td><td>${esc(d.owner)}</td>
        <td>${d.state.includes('modified')?`<span class="chip chip-danger">${ico('i-warn')}${esc(d.state)}</span>`:esc(d.state)}</td>
        <td class="mono" style="font-size:11.5px">${esc(d.hash)}</td></tr>`).join('')}</tbody></table>`);
    out += B('Remediation','i-check', `<ul class="crit">${a.remedy.map(r=>`<li>${ico('i-chev','ico-sm')}<span class="txt">${esc(r)}</span></li>`).join('')}</ul>`);
  }

  if(a.type==='budget'){
    out += B('Budget state','i-clock', `<div class="stat">
      <div class="s"><div class="k">${ico('i-check','ico-sm')}Turns used</div><div class="v">${a.budget.turnsUsed} / ${a.budget.turnsCap}</div><div class="q">exact</div></div>
      <div class="s"><div class="k">${ico('i-moon','ico-sm')}Window</div><div class="v" style="font-size:14px">${esc(a.budget.window)}</div><div class="q">local time</div></div>
      <div class="s"><div class="k">${ico('i-warn','ico-sm')}Credits</div><div class="v" style="font-size:14px">${esc(a.budget.credits)}</div><div class="q">not observable</div></div></div>
      <div class="consequence">${ico('i-info','ico-sm')}<span>${esc(a.budget.creditNote)}</span></div>`);
  }

  if(a.advisor) out += advisorHTML(a);
  if(a.type==='gate') out += B('Feedback for Request changes','i-doc',
    `<textarea class="free" id="fb" placeholder="Nonblank feedback is required before a change request can be sent." aria-label="Change request feedback">${esc(S.feedback)}</textarea>
     <div class="route" style="margin-top:7px">${ico('i-info','ico-sm')}<span>${esc(a.rejectHint)} Studio sends this to the canonical session; it never edits the artifact.</span></div>`);
  return out;
}

/* ---- artifact vs reviewer comparison: Option B centrepiece ---- */
function compareHTML(a){
  const ar=a.artifact;
  return `<div class="compare">
    <div class="pane">
      <div class="pane-head">${ico('i-doc','ico-sm')}<span class="nm">${esc(ar.name)}</span>
        <span class="chip" style="margin-left:auto">${esc(ar.rev)}</span></div>
      <div class="pane-body" id="artBody">
        <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">
          ${ar.toc.map(t=>`<span class="chip" style="font-size:10.5px">${esc(t)}</span>`).join('')}
        </div>
        ${ar.body}
        <h5>Change since revision 1</h5>
        ${ar.diff.map(d=>`<span class="diffline ${d.k}">${esc(d.t)}</span>`).join('')}
      </div>
      <div class="pane-head" style="border-top:1px solid var(--border);border-bottom:0">
        <span class="muted mono wrap-any" style="font-size:10.5px">${esc(ar.path)}</span>
        <span class="chip" style="margin-left:auto">read-only</span></div>
    </div>
    <div class="pane">
      <div class="pane-head">${ico('i-review','ico-sm')}<span class="nm">reviewer findings</span>
        <span class="chip chip-danger" style="margin-left:auto">1 open</span></div>
      <div class="pane-body">${a.findings.map(findingHTML).join('')}</div>
      <div class="pane-head" style="border-top:1px solid var(--border);border-bottom:0">
        <span class="muted" style="font-size:11px">Quoted verbatim from the stage review block</span></div>
    </div>
  </div>`;
}
function findingHTML(f){
  const badge={blocker:['chip-danger','i-warn','Blocker'],advisory:['chip-warn','i-info','Advisory'],resolved:['chip-ok','i-check','Answered']}[f.lvl];
  return `<div class="finding" data-lvl="${f.lvl}">
    <div class="fh"><span class="chip ${badge[0]}">${ico(badge[1])}${badge[2]}</span>
      <span class="muted mono" style="font-size:11px">${esc(f.by)} &middot; ${esc(f.cls)}</span>
      ${f.anchor?`<button class="anchor-link" data-anchor="${f.anchor}" style="margin-left:auto">${ico('i-link','ico-sm')}in artifact</button>`:''}</div>
    <div style="font-size:13px;color:var(--text-strong);font-weight:500">${esc(f.txt)}</div>
    <p class="fq">${esc(f.quote)}</p>
    <div class="muted" style="font-size:12px;margin-top:6px">${esc(f.fix)}</div>
  </div>`;
}

function artifactsTab(a){
  if(a.artifact) return B('Produced artifact','i-doc',
    `<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <span class="chip">${esc(a.artifact.bytes)}</span><span class="chip">updated ${esc(a.artifact.updated)}</span>
      <span class="chip">${esc(a.artifact.rev)}</span><span class="chip chip-info">${ico('i-git')}prior version derived from Git</span></div>`) + compareHTML(a);
  if(a.drift) return B('Files considered by this action','i-doc', `<table class="tbl"><thead><tr><th>Path</th><th>Ownership</th><th>State</th></tr></thead>
    <tbody>${a.drift.map(d=>`<tr><td class="mono wrap-any">${esc(d.path)}</td><td>${esc(d.owner)}</td><td>${esc(d.state)}</td></tr>`).join('')}</tbody></table>`);
  return B('Evidence files','i-doc', `<div class="evgrid">${(a.evidence||[]).map(e=>`
    <div class="ev"><div class="src">${ico(e.icon,'ico-sm')}${esc(e.src)}</div><div class="val">${esc(e.val)}</div><div class="sub">${esc(e.sub)}</div></div>`).join('')}</div>
    <div class="consequence" style="margin-top:12px">${ico('i-info','ico-sm')}<span>Raw audit blocks and payloads open in the Evidence drawer, subject to redaction policy.</span></div>`);
}
function reviewTab(a){
  const groups=[['blocker','Open blockers'],['advisory','Advisory'],['resolved','Answered in this revision']];
  return groups.map(([k,label])=>{
    const f=a.findings.filter(x=>x.lvl===k);
    return f.length? B(`${label} &mdash; ${f.length}`, k==='resolved'?'i-check':(k==='blocker'?'i-warn':'i-info'), f.map(findingHTML).join('')) : '';
  }).join('') + B('Review contract','i-lock', `<div class="evgrid">
    <div class="ev"><div class="src">Review class</div><div class="val">${esc(a.reviewClass)}</div><div class="sub">configured for this stage &mdash; exact</div></div>
    <div class="ev"><div class="src">Reviewer</div><div class="val">architecture-reviewer</div><div class="sub">review-only agent, cannot author artifacts</div></div>
    <div class="ev"><div class="src">Revisions</div><div class="val">${a.revision}</div><div class="sub">each revision re-ran the reviewer</div></div></div>`);
}
function activityTab(a){
  const rows=[
    {t:'19:41:55', src:'AI-DLC', i:'i-gate',    m:`Stage ${a.stage} reached <span class="mono">[?]</span> and is awaiting a human decision.`},
    {t:'19:41:12', src:'AI-DLC', i:'i-review',  m:'Reviewer pass completed. 1 blocker, 1 advisory, 2 answered.'},
    {t:'19:38:04', src:'AI-DLC', i:'i-doc',     m:'Artifact written by the stage agent.'},
    {t:'19:37:41', src:'Studio', i:'i-send',    m:`Action <span class="mono">${esc(a.id)}</span> created and queued for your decision.`},
    {t:'19:36:58', src:'KiroCrew', i:'i-activity', m:'Turn 12 dispatched into the canonical session under the repo lease.'},
    {t:'19:36:50', src:'Git',    i:'i-git',     m:'Observed <span class="mono">main</span>, working tree clean. No Git write was performed.'}
  ];
  return B('Timeline','i-activity', `<ul class="tl">${rows.map(r=>`<li>
    <span class="t">${r.t}</span><span class="m">${ico(r.i,'ico-sm')}</span>
    <span><span>${r.m}</span><span class="src">source: ${r.src}</span></span></li>`).join('')}</ul>
    <div class="consequence" style="margin-top:14px">${ico('i-info','ico-sm')}<span>Studio-derived events are labelled Studio. They are never presented as original AI-DLC audit events.</span></div>`);
}

/* ===================== advisor ===================== */
function advisorHTML(a){
  const st = S.advisor[a.id];
  if(!st) return B('AI Advisor','i-advisor', `<div class="advisor">
    <div class="advisor-head">${ico('i-advisor','ico-sm')}<span class="t">Advisor has not run</span></div>
    <p class="muted" style="margin:0;font-size:13px">The Advisor runs only when you ask. It uses a separate read-only session, cannot write files or move the workflow, and never produces human-turn evidence.</p>
    <div class="row" style="margin-top:11px"><button class="btn btn-sm" data-act="advisor">${ico('i-advisor','ico-sm')}${a.type==='questions'?'Draft all answers':'Analyze this decision'}</button>
    ${a.type==='questions'?'':`<button class="btn btn-sm" data-act="advisor">Draft change-request feedback</button>`}</div></div>`);

  const v=a.advisor;
  const L=(k,val)=>`<dt>${k}</dt><dd>${val}</dd>`;
  return B('AI Advisor &mdash; draft only','i-advisor', `<div class="advisor">
    <div class="advisor-head">${ico('i-advisor','ico-sm')}<span class="t">${esc(v.verdict)}</span>
      <span class="chip chip-aim">draft, not a decision</span></div>
    <p style="margin:0;font-size:13.5px;line-height:1.65">${esc(v.reason)}</p>
    <dl>
      ${L('Evidence', `<ul style="margin:0;padding-left:17px">${v.evidence.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`)}
      ${L('Assumptions', `<ul style="margin:0;padding-left:17px">${v.assumptions.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`)}
      ${L('Alternatives', `<ul style="margin:0;padding-left:17px">${v.alternatives.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`)}
      ${L('Confidence', esc(v.confidence))}
      ${L('Needs your decision', `<span class="chip chip-warn">${ico('i-warn')}unresolvable from evidence</span> ${esc(v.needsYou)}`)}
    </dl>
    ${v.draftFeedback?`<div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn btn-sm" data-act="usefeedback">${ico('i-doc','ico-sm')}Put the drafted feedback in the box</button>
      <span class="muted" style="font-size:11.5px">You can edit it before anything is sent.</span></div>`:''}
    ${v.picks?`<div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn btn-sm" data-act="applypicks">${ico('i-check','ico-sm')}Apply the drafted selections</button>
      <span class="muted" style="font-size:11.5px">Nothing is submitted. Approve is never preselected.</span></div>`:''}
    <div class="disclaim">${ico('i-lock','ico-sm')}<span>Advisor activity is recorded in Studio Activity only. It is never written into the AI-DLC audit trail, and it cannot mint a <span class="mono">HUMAN_TURN</span>.</span></div>
  </div>`);
}

/* ===================== questions ===================== */
function questionsHTML(a){
  return a.questions.map((q,qi)=>{
    const key=a.id+'/'+q.id, v=S.answers[key];
    const drafted = S.advisor[a.id]==='ready' ? a.advisor.picks[q.id] : null;
    const isSel = o => q.multi ? (Array.isArray(v)&&v.includes(o.id)) : v===o.id;
    return `<div class="q">
      <p class="q-prompt">${qi+1}. ${esc(q.prompt)}</p>
      <p class="q-sub"><span class="chip">${esc(q.header)}</span>
        <span class="chip">${q.multi?'select any':'select one'}</span>
        <span class="chip ${q.required?'chip-accent':''}">${q.required?'required':'optional'}</span></p>
      ${q.opts.map(o=>`<label class="opt ${isSel(o)?'sel':''}">
        <input type="${q.multi?'checkbox':'radio'}" name="${key}" value="${o.id}" ${isSel(o)?'checked':''} data-qkey="${key}" data-multi="${q.multi}">
        <span class="grow"><span class="ol">${esc(o.l)}</span><span class="od">${esc(o.d)}</span></span>
        ${drafted && (Array.isArray(drafted)?drafted.includes(o.id):drafted===o.id) ? `<span class="drafted chip chip-aim">${ico('i-advisor')}drafted</span>`:''}
      </label>`).join('')}
      ${q.other?`<label class="opt ${v==='__other'?'sel':''}"><input type="${q.multi?'checkbox':'radio'}" name="${key}" value="__other" ${v==='__other'?'checked':''} data-qkey="${key}" data-multi="${q.multi}">
        <span class="grow"><span class="ol">Other</span><span class="od">Free text, preserved exactly as the conductor offered it.</span></span></label>
        ${v==='__other'?`<textarea class="free" data-other="${key}" placeholder="Your answer">${esc(S.answers[key+'/other']||'')}</textarea>`:''}`:''}
    </div>`;
  }).join('') + `<div class="consequence" style="margin-top:12px">${ico('i-lock','ico-sm')}<span>Studio never edits <span class="mono">nfr-requirements-questions.md</span> or its digest. The group stays visible until delivery and state evidence prove it was accepted.</span></div>`;
}
</script>

<script>
/* ===================== workflow map ===================== */
function mapView(){
  const rel = RELATIONS[S.mapSel];
  const lanes = PHASES.map(p=>`
    <div class="lane" style="--ph:${p.accent}">
      <div class="lane-h"><div class="bar"></div><div class="nm">${esc(p.name)}</div>
        <div class="sub">${p.stages.length} stages &middot; ${p.stages.filter(s=>s.s==='skipped').length} skipped</div></div>
      <div>
        <div class="stages">${p.stages.map(s=>stageCard(s,rel)).join('')}</div>
        ${S.mapUnits && p.stages.some(s=>s.perUnit) ? unitLanes(p) : ''}
      </div>
    </div>`).join('');

  return `<div class="map-wrap">
    <div class="map-bar">
      <span class="chip chip-accent">${ico('i-intent')}checkout-web / guest-checkout</span>
      <span class="chip">33 stages known &middot; exact</span>
      <span class="chip">27 selected &middot; exact</span>
      <span class="chip">11 Gates &middot; exact</span>
      <div class="seg" role="group" aria-label="Density" style="margin-left:auto">
        ${['overview','detailed','dependencies'].map(d=>`<button data-density="${d}" aria-pressed="${S.mapDensity===d}">${d[0].toUpperCase()+d.slice(1)}</button>`).join('')}
      </div>
      <button class="btn btn-sm" data-act="units" aria-pressed="${S.mapUnits}">${ico('i-chevd','ico-sm')}${S.mapUnits?'Hide':'Expand'} Construction units</button>
    </div>
    <div style="display:flex;flex:1 1 auto;min-height:0">
      <div class="map-scroll">${lanes}
        <div class="consequence" style="margin-top:16px;max-width:820px">${ico('i-info','ico-sm')}<span>Dependency edges are not drawn by default. Selecting a stage overlays its upstream, downstream, consumes and produces relationships. Skipped stages keep their position and their reason.</span></div>
      </div>
      ${inspectorHTML()}
    </div></div>`;
}
function stageCard(s,rel){
  const cls = rel && rel.up.includes(s.n) ? 'up' : (rel && rel.down.includes(s.n) ? 'down' : '');
  const relTag = cls==='up' ? 'upstream' : (cls==='down' ? 'downstream' : '');
  const state = s.s==='gate' ? 'gate' : s.s;
  const badge = {done:['chip-ok','i-check','done'],current:['chip-accent','i-play','running'],gate:['chip-warn','i-gate','Gate open'],skipped:['chip','i-warn','skipped'],pending:['chip','i-clock','pending']}[state];
  return `<button class="stage ${cls}" data-stage="${s.n}" data-state="${state}" aria-pressed="${S.mapSel===s.n}">
    ${relTag?`<span class="rel">${relTag}</span>`:''}
    <span class="sn">${s.n}</span><span class="st">${esc(s.t)}</span>
    <span class="sm"><span class="chip ${badge[0]}" style="font-size:10px">${ico(badge[1])}${badge[2]}</span>
      ${S.mapDensity!=='overview'?`<span class="chip" style="font-size:10px">${esc(s.agent)}</span>
      ${s.rev!=='none'?`<span class="chip" style="font-size:10px">${esc(s.rev)}</span>`:''}
      <span class="chip" style="font-size:10px">${ico('i-clock')}${esc(s.el)}</span>`:''}
      ${s.gate?`<span class="chip" style="font-size:10px">${ico('i-gate')}Gate</span>`:''}</span>
  </button>`;
}
function unitLanes(p){
  const st = p.stages.filter(s=>s.perUnit);
  return `<div class="units">${st.map(s=>`<div><div class="unit">${ico('i-chev','ico-sm')}${esc(s.n)} ${esc(s.t)} &mdash; per unit</div>
    <div class="stages" style="margin:6px 0 4px 14px">${s.units.map(u=>`<button class="stage" data-state="pending" style="width:auto;min-width:150px">
      <span class="sn">${esc(s.n)}</span><span class="st">${esc(u.u)}</span>
      <span class="sm"><span class="chip" style="font-size:10px">${ico('i-clock')}pending</span></span></button>`).join('')}</div></div>`).join('')}</div>`;
}
function inspectorHTML(){
  const all = PHASES.flatMap(p=>p.stages.map(s=>({...s,phase:p.name,accent:p.accent})));
  const s = all.find(x=>x.n===S.mapSel); if(!s) return '';
  const rel = RELATIONS[s.n];
  const a = s.action ? act(s.action) : null;
  return `<aside class="inspector" aria-label="Stage inspector">
    <div class="row" style="gap:7px;margin-bottom:8px"><span class="chip" style="border-color:${s.accent};color:${s.accent}">${esc(s.phase)}</span>
      <span class="chip mono">${esc(s.n)}</span></div>
    <h2 style="margin:0 0 10px;font-size:16px;color:var(--text-strong)">${esc(s.t)}</h2>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:14px">
      <span class="chip">${ico('i-intent')}${esc(s.agent)}</span>
      ${s.gate?`<span class="chip chip-warn">${ico('i-gate')}Gate</span>`:''}
      ${s.rev!=='none'?`<span class="chip chip-info">${ico('i-review')}${esc(s.rev)}</span>`:''}
      <span class="chip">${ico('i-clock')}${esc(s.el)}</span></div>
    ${s.why?`<div class="consequence" style="margin-bottom:14px">${ico('i-info','ico-sm')}<span><b>Why it is skipped.</b> ${esc(s.why)}</span></div>`:''}
    ${rel?`<div class="block"><h3>Relationships</h3>
      <div class="ev"><div class="src">Upstream</div><div class="val">${rel.up.join(', ')}</div></div>
      <div class="ev" style="margin-top:7px"><div class="src">Downstream</div><div class="val">${rel.down.join(', ')}</div></div>
      <div class="ev" style="margin-top:7px"><div class="src">Consumes</div><div class="val wrap-any">${rel.consumes.join('<br>')}</div></div>
      <div class="ev" style="margin-top:7px"><div class="src">Produces</div><div class="val wrap-any">${rel.produces.join('<br>')}</div></div></div>`:''}
    ${a?`<button class="btn btn-primary" data-open="${a.id}" style="width:100%;justify-content:center">${ico(a.icon,'ico-sm')}Open the ${esc(a.typeLabel.toLowerCase())} in Action Center</button>`:
      `<button class="btn" style="width:100%;justify-content:center" disabled>${ico('i-lock','ico-sm')}No eligible operation at this stage</button>`}
  </aside>`;
}

/* ===================== four-step wizard ===================== */
const SCOPES=[
  {id:'bugfix',  l:'Bug fix',  d:'12 stages. Skips ideation and most of inception.'},
  {id:'feature', l:'Feature',  d:'27 of 33 stages. The default for scoped product work.'},
  {id:'mvp',     l:'MVP',      d:'31 stages. Adds market research and refined mockups.'},
  {id:'security',l:'Security patch', d:'9 stages. Adds compliance review, skips design exploration.'}
];
const DEPTHS=[{id:'light',l:'Light',d:'One pass per stage, fewer questions.'},{id:'standard',l:'Standard',d:'Recommended. Questions where the engine needs input.'},{id:'deep',l:'Deep',d:'More questions and longer artifacts.'}];
const REVIEWS=[{id:'none',l:'None',d:'No reviewer pass. Gates still require you.'},{id:'advisory',l:'Advisory',d:'Reviewer comments, does not block.'},{id:'adversarial',l:'Adversarial',d:'Reviewer must be answered before a Gate can pass.'}];
const TESTS=[{id:'minimal',l:'Minimal',d:'Smoke coverage only.'},{id:'standard',l:'Standard',d:'Unit plus integration for generated units.'},{id:'thorough',l:'Thorough',d:'Adds performance validation in operation.'}];
function wizardView(){
  const W=S.wiz;
  const steps=['Work','Preset','Plan','Review'];
  const bar = steps.map((s,i)=>`${i?'<span class="step-sep"></span>':''}
    <button class="step ${S.wizStep>i+1?'done':(S.wizStep===i+1?'now':'')}" data-wizstep="${i+1}">
      <span class="n">${S.wizStep>i+1?'&#10003;':i+1}</span>${s}</button>`).join('');
  let body='';
  if(S.wizStep===1) body=`
    <div class="field"><label>Repository</label><div class="help">Only registered repositories appear here.</div>
      <select id="wRepo">${REPOS.map(r=>`<option value="${r.id}" ${W.repo===r.id?'selected':''}>${esc(r.label)} &mdash; ${esc(r.path)}</option>`).join('')}</select></div>
    <div class="field"><label>Space</label><div class="help">Single-team installs only ever see <span class="mono">default</span>.</div>
      <select id="wSpace"><option>default</option><option>platform</option></select></div>
    <div class="field"><label>Objective</label><div class="help">One sentence. This becomes the intent slug and the ideation input.</div>
      <input type="text" id="wObj" value="${esc(W.objective)}" placeholder="Let signed-out shoppers complete a purchase"></div>
    <div class="field"><label>Context the engine should know</label>
      <textarea id="wCtx" placeholder="Existing cart service is v3. Payment provider retries once. No account creation is allowed in this flow.">${esc(W.context)}</textarea></div>
    <div class="field"><label>Project type signals</label><div class="help">Detected read-only from the repo; never edited.</div>
      <div class="row" style="gap:7px;flex-wrap:wrap"><span class="chip chip-ok">${ico('i-check')}TypeScript + Bun detected</span>
      <span class="chip chip-ok">${ico('i-check')}Existing test runner</span><span class="chip">${ico('i-git')}branch main, clean</span>
      <span class="chip chip-ok">${ico('i-check')}AI-DLC 2.4.1 installed</span></div></div>`;
  if(S.wizStep===2) body=`
    ${pickRow('Scope','Determines which of the 33 stages are eligible.','scope',SCOPES)}
    ${pickRow('Depth','Controls question volume and artifact detail.','depth',DEPTHS)}
    ${pickRow('Review cap','The strongest review class any stage may use.','review',REVIEWS)}
    ${pickRow('Test strategy','Controls test volume and whether performance validation is eligible.','test',TESTS)}`;
  if(S.wizStep===3) body=`
    <div class="consequence" style="margin-bottom:16px">${ico('i-info','ico-sm')}<span>Every known stage is listed, including the ones your preset excludes. Stages the engine will not let you change are disabled with a reason.</span></div>
    <div class="matrix">${PHASES.map(p=>`<div class="mrow" style="border-left:3px solid ${p.accent}">
      <div class="mh"><span>${esc(p.name)}</span><span class="chip">${p.stages.filter(s=>!S.wiz.off[s.n] && s.s!=='skipped').length} of ${p.stages.length} on</span></div>
      <div class="mstages">${p.stages.map(s=>{
        const locked = s.s==='done'||s.s==='current'||s.s==='gate';
        const on = !S.wiz.off[s.n] && s.s!=='skipped';
        return `<label class="ms ${on?'on':''} ${locked?'locked':''}" ${locked?`title="Immutable: ${s.s==='current'?'this is the current stage':'already completed or at its Gate'}"`:''}>
          <input type="checkbox" data-toggle="${s.n}" ${on?'checked':''} ${locked?'disabled':''}>
          <span class="mono">${s.n}</span><span>${esc(s.t)}</span>${s.gate?ico('i-gate','ico-sm'):''}${locked?ico('i-lock','ico-sm'):''}</label>`;
      }).join('')}</div></div>`).join('')}</div>
    <div class="consequence" style="margin-top:14px">${ico('i-warn','ico-sm')}<span>Turning off <span class="mono">2.4 nfr-requirements</span> would leave <span class="mono">3.1 contract-design</span> without its declared input, so the engine rejects that combination.</span></div>`;
  if(S.wizStep===4){
    const off=Object.keys(S.wiz.off).length;
    body=`
    <div class="stat">
      <div class="s"><div class="k">${ico('i-check','ico-sm')}Stages selected</div><div class="v">${27-off}</div><div class="q">exact, from the installed graph</div></div>
      <div class="s"><div class="k">${ico('i-gate','ico-sm')}Gates</div><div class="v">${11-Math.min(off,3)}</div><div class="q">exact</div></div>
      <div class="s"><div class="k">${ico('i-doc','ico-sm')}Artifacts produced</div><div class="v">${34-off*2}</div><div class="q">exact</div></div>
      <div class="s"><div class="k">${ico('i-review','ico-sm')}Review intensity</div><div class="v" style="font-size:14px">${esc(S.wiz.review)}</div><div class="q">exact, as configured</div></div>
    </div>
    <div class="stat">
      <div class="s"><div class="k">${ico('i-clock','ico-sm')}Turns</div><div class="v" style="font-size:16px">70 &ndash; 110</div><div class="q">range &middot; rule-based band &middot; low confidence, no local history yet</div></div>
      <div class="s"><div class="k">${ico('i-clock','ico-sm')}Active execution</div><div class="v" style="font-size:16px">4 &ndash; 7 h</div><div class="q">range &middot; medium confidence</div></div>
      <div class="s"><div class="k">${ico('i-clock','ico-sm')}Elapsed with your Gates</div><div class="v" style="font-size:16px">2 &ndash; 4 days</div><div class="q">range &middot; depends on your response time</div></div>
      <div class="s"><div class="k">${ico('i-warn','ico-sm')}Credits</div><div class="v" style="font-size:16px">Unavailable</div><div class="q">not observable from Kiro signals &mdash; not zero, not inferred</div></div>
    </div>
    ${B('What dominates the estimate','i-info',`<ul class="crit">
      <li>${ico('i-warn','ico-sm unmet')}<span class="txt">3.3 code-generation across 3 units &mdash; roughly 40% of the estimated turns<span class="why">Removing it removes all generated implementation. Not advisable for this objective.</span></span></li>
      <li>${ico('i-warn','ico-sm unmet')}<span class="txt">Adversarial review on 4 stages &mdash; roughly 18%<span class="why">Lowering the review cap to advisory saves time and drops the requirement that findings be answered before a Gate passes.</span></span></li></ul>`)}
    ${B('Plan diff against the preset default','i-doc', off?`${Object.keys(S.wiz.off).map(n=>`<span class="diffline del">- ${n} disabled by you</span>`).join('')}`:'<span class="diffline add">+ no changes &mdash; this is the unmodified feature preset</span>')}
    ${B('Products this plan will create','i-doc',`<div class="row" style="gap:7px;flex-wrap:wrap">
      ${['scope-definition.md','user-stories.md','requirements-analysis.md','functional-design.md','nfr-requirements.md','domain-design.md','contract-design.md','units/','build-and-test report','ci-pipeline.md'].map(f=>`<span class="chip mono" style="font-size:11px">${esc(f)}</span>`).join('')}</div>`)}
    <div class="consequence">${ico('i-info','ico-sm')}<span>Create does not run anything. The intent is created paused; you start it with <b>Run to next checkpoint</b>. Keep moving, budgets and Advisor drafts are never inherited from another intent.</span></div>`;
  }
  return `<div class="view-scroll"><div class="wiz">
    <h1 style="margin:0 0 4px;font-size:20px;color:var(--text-strong)">New intent</h1>
    <p class="lede">Four steps. Nothing is written to the repository until you press Create, and Create never starts execution.</p>
    <div class="steps">${bar}</div>
    ${body}
    <div class="wiz-bar">
      <button class="btn" data-wiznav="-1" ${S.wizStep===1?'disabled':''}>Back</button>
      ${S.wizStep<4?`<button class="btn btn-primary" data-wiznav="1">Continue</button>`
        :`<button class="btn btn-primary" data-act="create">${ico('i-check','ico-sm')}Create the intent, paused</button>`}
      <span class="muted" style="font-size:11.5px;margin-left:auto">Step ${S.wizStep} of 4</span>
    </div>
  </div></div>`;
}
function pickRow(label,help,key,list){
  return `<div class="field"><label>${label}</label><div class="help">${help}</div>
    <div class="picks">${list.map(o=>`<button class="pick ${S.wiz[key]===o.id?'sel':''}" data-pick="${key}" data-val="${o.id}">
      <div class="pl">${esc(o.l)}</div><div class="pd">${esc(o.d)}</div></button>`).join('')}</div></div>`;
}

/* ===================== secondary pages ===================== */
function reposView(){
  return `<div class="view-scroll"><div class="page"><h1>Repos</h1>
    <p class="lede">Three registered paths. Studio never scans the home directory; every entry here was added deliberately.</p>
    <table class="tbl"><thead><tr><th>Repository</th><th>AI-DLC</th><th>Engine</th><th>Intents</th><th>Queue</th><th>Git</th><th></th></tr></thead><tbody>
    ${REPOS.map(r=>`<tr><td><div class="strong">${esc(r.label)}</div><div class="muted mono" style="font-size:11.5px">${esc(r.path)}</div></td>
      <td>${r.install==='ok'?`<span class="chip chip-ok">${ico('i-check')}installed</span>`:`<span class="chip chip-warn">${ico('i-warn')}drift &middot; upgrade stopped</span>`}</td>
      <td class="mono">${esc(r.engine)}${r.engine!=='2.4.1'?`<div class="muted" style="font-size:11px">bundled 2.4.1</div>`:''}</td>
      <td class="mono">${r.intents}</td><td class="mono">${r.queue}</td>
      <td><span class="chip">${ico('i-git')}main &middot; clean</span></td>
      <td>${r.install==='ok'?`<button class="btn btn-sm">Maintenance</button>`:`<button class="btn btn-sm" data-open="a-005">Review conflict</button>`}</td></tr>`).join('')}
    </tbody></table>
    <div class="consequence" style="margin-top:16px;max-width:820px">${ico('i-info','ico-sm')}<span>Maintenance upgrades live here and in notifications; they never enter the blocking workflow queue. Removing a repository unregisters it and changes no bytes on disk.</span></div>
  </div></div>`;
}
function intentsView(){
  const rows=[
    ['checkout-web','guest-checkout','Waiting for you','2.3 functional-design','chip-accent','a-002'],
    ['checkout-web','cart-persistence','Running','3.3 code-generation &middot; unit 2','chip-ok',null],
    ['payments-api','idempotent-refunds','Waiting for you','2.4 nfr-requirements','chip-accent','a-003'],
    ['payments-api','refund-webhooks','Queued','3.2 units-generation','chip','a-006'],
    ['payments-api','ledger-audit','Parked','2.1 requirements-analysis','chip',null],
    ['infra-platform','observability-baseline','Circuit open','3.3 build-and-test','chip-warn','a-004']
  ];
  return `<div class="view-scroll"><div class="page"><h1>Intents</h1>
    <p class="lede">Multiple intents may be in flight in one repository. Turns serialize per repository; different repositories run in parallel.</p>
    <table class="tbl"><thead><tr><th>Repo</th><th>Intent</th><th>State</th><th>Stage</th><th>Keep moving</th><th></th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="mono">${r[0]}</td><td class="strong">${r[1]}</td>
      <td><span class="chip ${r[4]}">${r[2]}</span></td><td class="mono" style="font-size:12px">${r[3]}</td>
      <td>${r[2]==='Circuit open'?`<span class="chip chip-warn">disabled by breaker</span>`:(r[2]==='Running'?`<span class="chip chip-ok">${ico('i-check')}on</span>`:'<span class="muted">off</span>')}</td>
      <td>${r[5]?`<button class="btn btn-sm" data-open="${r[5]}">Open action</button>`:`<button class="btn btn-sm">Details</button>`}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}
function activityView(){
  const rows=[
    ['19:42:09','Studio','i-warn','Gateway restart detected. Action <span class="mono">act_7712</span> delivery became uncertain; automatic replay was suppressed.'],
    ['19:41:55','AI-DLC','i-gate','<span class="mono">payments-api/idempotent-refunds</span> reached <span class="mono">[?]</span> at stage 3.4.'],
    ['19:37:41','Studio','i-send','Action <span class="mono">a-002</span> created for <span class="mono">checkout-web/guest-checkout</span>.'],
    ['19:14:51','KiroCrew','i-fail','ACP stream closed. Fingerprint <span class="mono">acp.transport.stream_closed:5f2c9a</span> reached 3; breaker opened.'],
    ['18:02:10','Studio','i-advisor','Advisor draft requested for a-002. Read-only session, no workflow effect.'],
    ['16:20:00','AI-DLC','i-check','Stage 2.2 refined-mockups approved by human turn 6.'],
    ['09:14:00','Studio','i-install','Upgrade preview for <span class="mono">infra-platform</span> stopped on receipt drift. Nothing was written.']
  ];
  return `<div class="view-scroll"><div class="page"><h1>Activity</h1>
    <p class="lede">Human-readable timeline. Every event names its source, and a Studio-derived event is never shown as an AI-DLC audit event.</p>
    <div class="row" style="gap:7px;flex-wrap:wrap;margin-bottom:14px">
      ${['All sources','AI-DLC','Studio','KiroCrew','Git'].map((f,i)=>`<span class="chip ${i===0?'chip-accent':''}">${esc(f)}</span>`).join('')}</div>
    <ul class="tl">${rows.map(r=>`<li><span class="t">${r[0]}</span><span class="m">${ico(r[2],'ico-sm')}</span>
      <span><span>${r[3]}</span><span class="src">source: ${r[1]}</span></span></li>`).join('')}</ul>
    <div class="consequence" style="margin-top:16px;max-width:820px">${ico('i-lock','ico-sm')}<span>The Evidence drawer exposes raw audit blocks and file locations. Diagnostic export redacts credentials, protected paths and prompt bodies by default.</span></div>
  </div></div>`;
}
function settingsView(){
  const row=(t,d,ctl)=>`<div class="mrow"><div class="spread"><div><div class="strong" style="font-size:13.5px">${t}</div><div class="muted" style="font-size:12px;margin-top:2px">${d}</div></div>${ctl}</div></div>`;
  return `<div class="view-scroll"><div class="page"><h1>Settings</h1>
    <p class="lede">Studio-owned preferences. Nothing here changes AI-DLC files.</p>
    <div class="matrix">
      ${row('Language','English and Simplified Chinese ship complete and parity-tested.','<select style="padding:6px 9px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--border)"><option>English (en-US)</option><option>&#31616;&#20307;&#20013;&#25991; (zh-CN)</option></select>')}
      ${row('Theme','Follows KiroCrew tokens in light and dark.','<button class="btn btn-sm" id="themeBtn2">'+ico('i-moon','ico-sm')+'Toggle</button>')}
      ${row('Night work window','Off by default. Only intents with Keep moving participate.','<span class="chip">22:00 &ndash; 06:00 &middot; off</span>')}
      ${row('Turn cap per window','Checked before dispatch; never interrupts a running turn.','<span class="chip mono">40</span>')}
      ${row('Credit cap','Disabled because credit consumption is not observable from the available signals.','<span class="chip chip-warn">'+ico('i-warn')+'unavailable</span>')}
      ${row('Global concurrency','Per-repo execution is always one and cannot be raised.','<span class="chip mono">3 repos</span>')}
      ${row('Slack quick actions','Blocking events only. Complex question groups deep-link back here.','<span class="chip chip-ok">'+ico('i-slack')+'owner DM</span>')}
      ${row('Advisor model','Inherited through KiroCrew role resolution. No model id is hardcoded.','<span class="chip">'+ico('i-advisor')+'inherited</span>')}
      ${row('Versions','App version and bundled AI-DLC version are separately visible.','<span class="chip mono">Studio 1.0.0 &middot; AI-DLC 2.4.1</span>')}
    </div></div></div>`;
}

/* ===================== router ===================== */
function render(){
  renderChrome();
  const v=$('#view');
  if(S.route==='actions')       v.innerHTML = `<div class="ac">${queueHTML()}${detailHTML()}</div>`;
  else if(S.route==='map')      v.innerHTML = mapView();
  else if(S.route==='wizard')   v.innerHTML = wizardView();
  else if(S.route==='repos')    v.innerHTML = reposView();
  else if(S.route==='intents')  v.innerHTML = intentsView();
  else if(S.route==='activity') v.innerHTML = activityView();
  else                          v.innerHTML = settingsView();
  const fb=$('#fb'); if(fb) fb.addEventListener('input',e=>{S.feedback=e.target.value;});
}
function go(route){ S.route=route; if(route!=='actions') document.body.dataset.pane='list'; render(); }

/* ===================== events ===================== */
document.addEventListener('click', e=>{
  const t = e.target;
  const nav = t.closest('[data-route]');        if(nav){ go(nav.dataset.route); return; }
  if(t.closest('#backBtn')){ document.body.dataset.pane='list'; return; }
  if(t.closest('#themeBtn, #themeBtn2')){ const d=document.documentElement; d.dataset.theme = d.dataset.theme==='dark'?'light':'dark'; render(); return; }

  const q = t.closest('.qitem');
  if(q){ S.sel=q.dataset.id; S.tab='decision'; S.confirm=null; document.body.dataset.pane='detail'; render(); return; }
  const open = t.closest('[data-open]');
  if(open){ S.sel=open.dataset.open; S.tab='decision'; S.confirm=null; S.route='actions'; document.body.dataset.pane='detail'; render(); return; }
  const ord = t.closest('[data-order]');        if(ord){ S.order=ord.dataset.order; render(); return; }
  const tab = t.closest('[data-tab]');          if(tab){ S.tab=tab.dataset.tab; render(); return; }
  if(t.closest('#scopeBtn')){
    const i=REPOS.findIndex(r=>r.id===S.scope);
    S.scope = S.scope==='all' ? REPOS[0].id : (i>=REPOS.length-1 ? 'all' : REPOS[i+1].id);
    const vis=visible(); if(!vis.find(a=>a.id===S.sel)) S.sel = vis[0]?vis[0].id:null;
    render(); return;
  }
  const anchor = t.closest('[data-anchor]');
  if(anchor){ const id=anchor.dataset.anchor;
    if(S.tab!=='artifacts'){ S.tab='artifacts'; render(); }
    const el=document.getElementById(id);
    if(el){ el.classList.add('hl'); el.scrollIntoView({block:'center', behavior:'smooth'}); setTimeout(()=>el.classList.remove('hl'),2200); }
    return; }
  const copy = t.closest('[data-copy]');
  if(copy){ copy.innerHTML = ico('i-check','ico-sm')+'copied'; return; }

  const stage = t.closest('[data-stage]');      if(stage){ S.mapSel=stage.dataset.stage; render(); return; }
  const dens = t.closest('[data-density]');     if(dens){ S.mapDensity=dens.dataset.density; render(); return; }
  const pick = t.closest('[data-pick]');        if(pick){ S.wiz[pick.dataset.pick]=pick.dataset.val; render(); return; }
  const wstep = t.closest('[data-wizstep]');    if(wstep){ S.wizStep=+wstep.dataset.wizstep; render(); return; }
  const wnav = t.closest('[data-wiznav]');      if(wnav){ S.wizStep=Math.min(4,Math.max(1,S.wizStep + +wnav.dataset.wiznav)); render(); return; }

  const ab = t.closest('[data-act]'); if(!ab) return;
  const a = act(S.sel);
  switch(ab.dataset.act){
    case 'units':    S.mapUnits=!S.mapUnits; render(); break;
    case 'advisor':
    case 'draftall': S.advisor[a.id]='ready'; render();
                     { const p=$('.advisor'); if(p) p.scrollIntoView({block:'center',behavior:'smooth'}); } break;
    case 'usefeedback': S.feedback=a.advisor.draftFeedback; render();
                     { const f=$('#fb'); if(f){ f.focus(); f.scrollIntoView({block:'center',behavior:'smooth'}); } } break;
    case 'applypicks': Object.entries(a.advisor.picks).forEach(([qid,v])=>{ S.answers[a.id+'/'+qid]=v; }); render(); break;
    case 'approve':  S.confirm='approve'; render(); break;
    case 'reject':   S.confirm='reject';  render(); { const f=$('#fb'); if(f && !S.feedback.trim()) f.focus(); } break;
    case 'answers':  S.confirm='answers'; render(); break;
    case 'recovery': S.confirm='recovery'; render(); break;
    case 'cancel':   S.confirm=null; render(); break;
    case 'send':     S.confirm=null; S.sent[a.id]=3; render(); break;
    case 'retry':    S.sent[a.id]=2; render(); break;
    case 'undo':     document.body.dataset.pane='list'; break;
    case 'create':   S.route='actions'; document.body.dataset.pane='list'; render();
                     window.alert('Intent created and left paused.\n\nNothing has run yet. Start it from Intents with "Run to next checkpoint".'); break;
  }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='qSearch'){
    S.query=t.value; const vis=visible(); if(!vis.find(x=>x.id===S.sel)) S.sel=vis[0]?vis[0].id:null;
    render(); const f=$('#qSearch'); if(f){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); } return;
  }
  if(t.dataset.other){ S.answers[t.dataset.other+'/other']=t.value; return; }
  if(t.id==='wObj'){ S.wiz.objective=t.value; return; }
  if(t.id==='wCtx'){ S.wiz.context=t.value; return; }
  if(t.id==='wRepo'){ S.wiz.repo=t.value; return; }
  if(t.dataset.qkey){
    const key=t.dataset.qkey, multi=t.dataset.multi==='true';
    if(multi){
      const cur=Array.isArray(S.answers[key])?S.answers[key].slice():[];
      const i=cur.indexOf(t.value);
      if(t.checked){ if(i<0) cur.push(t.value); } else if(i>=0) cur.splice(i,1);
      S.answers[key]=cur;
    } else S.answers[key]=t.value;
    render(); return;
  }
  if(t.dataset.toggle){ const n=t.dataset.toggle; if(t.checked) delete S.wiz.off[n]; else S.wiz.off[n]=true; render(); return; }
  if(t.name==='rec'){ S.recoveryChoice=t.value; render(); return; }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.confirm){ S.confirm=null; render(); } });

render();
</script>
</body>
