<!DOCTYPE html>
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-DLC Studio — Option B: Evidence First</title>
<style>
/* ============================================================
   Option B — Evidence First
   Tokens mirrored from KiroCrew website/src/index.css so the mockup
   previews inside the real dashboard palette. Light + dark only.
   ============================================================ */
:root{
  --font-body:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:16px;
}
html[data-theme="dark"]{
  --bg:#12141a;--bg-accent:#14161d;--bg-elevated:#1a1d25;--bg-hover:#262a35;
  --card:#181b22;--card-fg:#f4f4f5;--card-hl:rgba(255,255,255,.05);
  --panel:#12141a;--panel-strong:#1a1d25;--chrome:rgba(18,20,26,.95);
  --text:#e4e4e7;--text-strong:#fafafa;--muted:#7f7f88;--muted-strong:#a1a1aa;
  --border:#27272a;--border-strong:#3f3f46;--border-hover:#52525b;
  --accent:#00d492;--accent-fg:#000;--accent-hover:#34d399;--accent-subtle:rgba(4,117,88,.2);
  --ring:#10b981;
  --ok:#22c55e;--ok-fg:#000;--ok-subtle:rgba(34,197,94,.12);
  --warn:#eab308;--warn-fg:#000;--warn-subtle:rgba(234,179,8,.12);
  --danger:#ef4444;--danger-fg:#000;--danger-subtle:rgba(239,68,68,.12);
  --info:#38bdf8;--info-fg:#000;--info-subtle:rgba(56,189,248,.12);
  --aim:#a78bfa;--aim-subtle:rgba(167,139,250,.15);
  --diff-add:rgba(46,160,67,.15);--diff-add-text:#7ee787;
  --diff-del:rgba(248,81,73,.15);--diff-del-text:#ffa198;
  --shadow-sm:0 1px 2px rgba(0,0,0,.2);
  --shadow-md:0 4px 12px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.03);
  --shadow-lg:0 12px 28px rgba(0,0,0,.35);
  /* restrained AI-DLC phase accents */
  --ph-init:#94a3b8;--ph-idea:#a78bfa;--ph-incep:#38bdf8;--ph-constr:#00d492;--ph-oper:#eab308;
}
html[data-theme="light"]{
  --bg:#fafafa;--bg-accent:#f5f5f5;--bg-elevated:#ffffff;--bg-hover:#f0f0f0;
  --card:#ffffff;--card-fg:#18181b;--card-hl:rgba(0,0,0,.03);
  --panel:#fafafa;--panel-strong:#ffffff;--chrome:rgba(255,255,255,.95);
  --text:#3f3f46;--text-strong:#18181b;--muted:#71717a;--muted-strong:#52525b;
  --border:#e4e4e7;--border-strong:#d4d4d8;--border-hover:#a1a1aa;
  --accent:#047558;--accent-fg:#fff;--accent-hover:#059669;--accent-subtle:rgba(4,117,88,.12);
  --ring:#047558;
  --ok:#16a34a;--ok-fg:#fff;--ok-subtle:rgba(22,163,74,.1);
  --warn:#a16207;--warn-fg:#fff;--warn-subtle:rgba(161,98,7,.1);
  --danger:#dc2626;--danger-fg:#fff;--danger-subtle:rgba(220,38,38,.1);
  --info:#0e7490;--info-fg:#fff;--info-subtle:rgba(14,116,144,.1);
  --aim:#7c3aed;--aim-subtle:rgba(124,58,237,.12);
  --diff-add:rgba(22,163,74,.12);--diff-add-text:#15803d;
  --diff-del:rgba(220,38,38,.1);--diff-del-text:#b91c1c;
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04);
  --shadow-lg:0 12px 28px rgba(0,0,0,.12);
  --ph-init:#64748b;--ph-idea:#7c3aed;--ph-incep:#0e7490;--ph-constr:#047558;--ph-oper:#a16207;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--radius-sm)}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* ---------- primitives ---------- */
.mono{font-family:var(--mono);font-variant-ligatures:none}
.ico{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico-sm{width:13px;height:13px}
.ico-lg{width:18px;height:18px}
.muted{color:var(--muted)}
.strong{color:var(--text-strong)}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1 1 auto;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap-any{overflow-wrap:anywhere}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 13px;border-radius:var(--radius-md);
  background:var(--bg-elevated);border:1px solid var(--border);
  color:var(--text);cursor:pointer;font-size:13px;
  transition:background .12s,border-color .12s;min-height:34px;
}
.btn:hover{background:var(--bg-hover);border-color:var(--border-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.btn-danger:hover{background:var(--danger-subtle)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--bg-hover);color:var(--text)}
.btn-sm{padding:4px 9px;min-height:28px;font-size:12px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border-radius:var(--radius-md);background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--bg-hover);color:var(--text)}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 8px;border-radius:999px;font-size:11.5px;line-height:1.7;
  border:1px solid var(--border);background:var(--bg-elevated);color:var(--muted-strong);
  white-space:nowrap;
}
.chip svg{width:11px;height:11px;stroke-width:2}
.chip-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--border));background:var(--danger-subtle)}
.chip-warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--border));background:var(--warn-subtle)}
.chip-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--border));background:var(--ok-subtle)}
.chip-info{color:var(--info);border-color:color-mix(in srgb,var(--info) 35%,var(--border));background:var(--info-subtle)}
.chip-accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--border));background:var(--accent-subtle)}
.chip-aim{color:var(--aim);border-color:color-mix(in srgb,var(--aim) 40%,var(--border));background:var(--aim-subtle)}

.card{background:var(--card);color:var(--card-fg);border:1px solid var(--border);border-radius:var(--radius-lg)}
.kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;background:var(--bg-elevated);color:var(--muted-strong)}

/* ---------- app frame ---------- */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

.topbar{
  display:flex;align-items:center;gap:14px;padding:0 16px;height:52px;flex:0 0 auto;
  background:var(--chrome);border-bottom:1px solid var(--border);backdrop-filter:blur(8px);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;color:var(--text-strong);letter-spacing:-.01em}
.brand-mark{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--accent-subtle);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--border));color:var(--accent)}
.variant-tag{
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;color:var(--aim);
  background:var(--aim-subtle);border:1px solid color-mix(in srgb,var(--aim) 45%,var(--border));
}
.nav{display:flex;gap:2px;margin-left:8px}
.nav button{
  display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:var(--radius-md);
  background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;font-size:13px;
}
.nav button:hover{background:var(--bg-hover);color:var(--text)}
.nav button[aria-current="page"]{background:var(--bg-elevated);border-color:var(--border);color:var(--text-strong);font-weight:600}
.nav .count{font-family:var(--mono);font-size:10.5px;padding:0 5px;border-radius:999px;background:var(--danger);color:var(--danger-fg);font-weight:700}

/* scope bar */
.scopebar{
  display:flex;align-items:center;gap:10px;padding:8px 16px;flex:0 0 auto;
  background:var(--bg-accent);border-bottom:1px solid var(--border);font-size:12.5px;
}
.scope-select{
  display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:var(--radius-md);
  background:var(--bg-elevated);border:1px solid var(--border);cursor:pointer;color:var(--text)
}
.scope-select:hover{border-color:var(--border-hover)}
.crumb{display:flex;align-items:center;gap:7px;color:var(--muted);min-width:0}
.crumb .sep{opacity:.5}
.crumb b{color:var(--text);font-weight:600}
.exec-strip{display:flex;align-items:center;gap:8px;margin-left:auto}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-subtle);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.view{flex:1 1 auto;min-height:0;overflow:hidden;display:flex}
.view-scroll{flex:1 1 auto;min-height:0;overflow:auto}

/* ============================================================
   ACTION CENTER — evidence-first master/detail
   Queue is deliberately narrow and visually quiet: no severity fills,
   no competing color blocks. Weight goes to the decision brief.
   ============================================================ */
.ac{display:grid;grid-template-columns:300px minmax(0,1fr);flex:1 1 auto;min-height:0}

/* ---- quiet queue ---- */
.queue{
  display:flex;flex-direction:column;min-height:0;
  background:var(--panel);border-right:1px solid var(--border);
}
.queue-head{padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:9px}
.queue-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.queue-title h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.queue-title .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.search{display:flex;align-items:center;gap:7px;padding:5px 9px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-elevated);color:var(--muted)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:12.5px;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.seg{display:flex;gap:2px;padding:2px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md)}
.seg button{flex:1;padding:4px 6px;border:0;border-radius:5px;background:transparent;color:var(--muted);cursor:pointer;font-size:11.5px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text-strong);font-weight:600;box-shadow:var(--shadow-sm)}

.queue-list{flex:1 1 auto;min-height:0;overflow:auto;padding:6px}
.qgroup{padding:11px 8px 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.qgroup::after{content:"";flex:1;height:1px;background:var(--border)}

.qitem{
  display:grid;grid-template-columns:12px minmax(0,1fr);gap:9px;
  width:100%;text-align:left;padding:9px 10px;margin-bottom:2px;
  background:transparent;border:1px solid transparent;border-radius:var(--radius-md);
  cursor:pointer;color:var(--text);
}
.qitem:hover{background:var(--bg-hover)}
.qitem[aria-current="true"]{background:var(--card);border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
/* severity = a 2px rule + icon + text label. Never fill alone. */
.qrule{width:2px;border-radius:2px;background:var(--border-strong);align-self:stretch}
.qitem[data-sev="critical"] .qrule{background:var(--danger)}
.qitem[data-sev="blocking"] .qrule{background:var(--accent)}
.qitem[data-sev="attention"] .qrule{background:var(--warn)}
.qitem[data-sev="info"] .qrule{background:var(--muted)}
.qtop{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:2px}
.qtop .type{display:inline-flex;align-items:center;gap:4px;color:var(--text);font-weight:600}
.qtop .dot{opacity:.45}
.qtitle{font-size:13px;color:var(--text-strong);font-weight:500;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qmeta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.qmeta .wait{color:var(--muted-strong)}
.qitem[data-sev="critical"] .qmeta .wait{color:var(--danger)}

/* ---- detail: spacious, single reading column ---- */
.detail{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.detail-head{padding:20px 32px 0;flex:0 0 auto}
.dbreadcrumb{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-bottom:10px;flex-wrap:wrap}
.dtitle{margin:0 0 8px;font-size:23px;line-height:1.28;font-weight:600;letter-spacing:-.015em;color:var(--text-strong);max-width:62ch}
.dfacts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--border)}
.tabs button{
  position:relative;padding:9px 1px 11px;background:transparent;border:0;cursor:pointer;
  color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:7px;
}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text-strong);font-weight:600}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px 2px 0 0}
.tabs .tc{font-family:var(--mono);font-size:10.5px;padding:0 5px;border-radius:999px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--muted)}

.detail-body{flex:1 1 auto;min-height:0;overflow:auto;padding:22px 32px 30px}
.reading{max-width:820px}

/* calm section blocks */
.block{margin-bottom:22px}
.block > h3{
  margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:8px;
}
.block > h3::after{content:"";flex:1;height:1px;background:var(--border)}
.brief{
  padding:18px 20px;border-radius:var(--radius-lg);background:var(--card);
  border:1px solid var(--border);border-left:3px solid var(--accent);box-shadow:var(--shadow-sm);
}
.brief p{margin:0 0 10px;font-size:15px;line-height:1.68;color:var(--card-fg)}
.brief p:last-child{margin-bottom:0}
.consequence{
  margin-top:14px;padding:11px 13px;border-radius:var(--radius-md);
  background:var(--info-subtle);border:1px solid color-mix(in srgb,var(--info) 30%,var(--border));
  font-size:13px;display:flex;gap:9px;align-items:flex-start;color:var(--text)
}
.consequence svg{color:var(--info);margin-top:2px}

.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.crit li{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:var(--radius-md);background:var(--card);border:1px solid var(--border)}
.crit li + li{margin-top:5px}
.crit svg{margin-top:3px;flex:0 0 auto}
.crit .met{color:var(--ok)}
.crit .unmet{color:var(--warn)}
.crit .txt{font-size:13.5px}
.crit .why{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* artifact / reviewer comparison — the centerpiece of Option B */
.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.pane{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;overflow:hidden}
.pane-head{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--border);background:var(--bg-accent);font-size:12px}
.pane-head .nm{font-weight:600;color:var(--text-strong);font-family:var(--mono);font-size:12px}
.pane-body{padding:13px 15px;font-size:13px;max-height:340px;overflow:auto}
.pane-body h4{margin:0 0 7px;font-size:13.5px;color:var(--text-strong)}
.pane-body h5{margin:14px 0 5px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pane-body p{margin:0 0 9px;line-height:1.62}
.pane-body ul{margin:0 0 9px;padding-left:18px}
.pane-body li{margin-bottom:4px}
.pane-body table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
.pane-body th,.pane-body td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--border)}
.pane-body th{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.pane-body code{font-family:var(--mono);font-size:11.5px;background:var(--bg-elevated);padding:1px 4px;border-radius:4px}
.diffline{display:block;font-family:var(--mono);font-size:11.5px;padding:1px 6px;border-radius:3px;white-space:pre-wrap}
.diffline.add{background:var(--diff-add);color:var(--diff-add-text)}
.diffline.del{background:var(--diff-del);color:var(--diff-del-text)}

.finding{padding:11px 13px;border-radius:var(--radius-md);background:var(--bg-elevated);border:1px solid var(--border);border-left:3px solid var(--border-strong)}
.finding + .finding{margin-top:8px}
.finding[data-lvl="blocker"]{border-left-color:var(--danger)}
.finding[data-lvl="advisory"]{border-left-color:var(--warn)}
.finding[data-lvl="resolved"]{border-left-color:var(--ok)}
.finding .fh{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px}
.finding .fq{margin:6px 0 0;padding-left:11px;border-left:2px solid var(--border-strong);font-size:12.5px;color:var(--muted-strong);font-style:italic}
.anchor-link{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font-family:var(--mono)}
.anchor-link:hover{text-decoration:underline}
.hl{background:var(--warn-subtle);box-shadow:0 0 0 2px var(--warn-subtle);border-radius:3px;transition:background .3s}

/* advisor */
.advisor{border:1px dashed color-mix(in srgb,var(--aim) 55%,var(--border));background:var(--aim-subtle);border-radius:var(--radius-lg);padding:14px 16px}
.advisor-head{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.advisor-head .t{font-weight:600;color:var(--text-strong);font-size:13.5px}
.advisor dl{display:grid;grid-template-columns:118px minmax(0,1fr);gap:6px 14px;margin:10px 0 0;font-size:13px}
.advisor dt{color:var(--muted);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding-top:2px}
.advisor dd{margin:0;line-height:1.6}
.advisor .disclaim{margin-top:12px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--aim) 30%,var(--border));font-size:11.5px;color:var(--muted);display:flex;gap:7px;align-items:flex-start}

/* questions */
.q{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px}
.q + .q{margin-top:12px}
.q-prompt{font-size:15px;font-weight:600;color:var(--text-strong);margin:0 0 3px;line-height:1.5}
.q-sub{font-size:12px;color:var(--muted);margin:0 0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opt{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;background:var(--bg-elevated)}
.opt + .opt{margin-top:7px}
.opt:hover{border-color:var(--border-hover)}
.opt input{margin-top:3px;accent-color:var(--accent);width:15px;height:15px}
.opt.sel{border-color:var(--accent);background:var(--accent-subtle)}
.opt .ol{font-size:13.5px;color:var(--text-strong);font-weight:500}
.opt .od{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.55}
.opt .drafted{margin-left:auto;flex:0 0 auto}
textarea.free{width:100%;margin-top:8px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-elevated);color:var(--text);resize:vertical;min-height:64px;font-size:13px}
textarea.free:focus{outline:2px solid var(--ring);outline-offset:1px}

/* recovery evidence grid */
.evgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:10px}
.ev{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:11px 13px}
.ev .src{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ev .val{font-family:var(--mono);font-size:12.5px;color:var(--text-strong);overflow-wrap:anywhere}
.ev .sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.ev[data-conflict="true"]{border-color:color-mix(in srgb,var(--danger) 45%,var(--border));background:var(--danger-subtle)}
.choice{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);cursor:pointer}
.choice + .choice{margin-top:9px}
.choice:hover{border-color:var(--border-hover)}
.choice.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.choice input{margin-top:4px;accent-color:var(--accent)}
.choice .cl{font-size:13.5px;font-weight:600;color:var(--text-strong)}
.choice .cd{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.55}

/* sticky action bar — never covers the last evidence block (body has pad-bottom) */
.actionbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 32px;background:var(--chrome);border-top:1px solid var(--border);
  backdrop-filter:blur(8px);
}
.actionbar .hint{font-size:11.5px;color:var(--muted);margin-right:auto;display:flex;align-items:center;gap:7px}
.confirm{
  margin:0 32px 12px;padding:14px 16px;border-radius:var(--radius-lg);
  background:var(--card);border:1px solid var(--accent);box-shadow:var(--shadow-md);flex:0 0 auto
}
.confirm .ch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-strong);margin-bottom:9px}
.sendtext{
  font-family:var(--mono);font-size:12.5px;padding:10px 12px;border-radius:var(--radius-md);
  background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-strong);
  white-space:pre-wrap;overflow-wrap:anywhere
}
.route{font-size:11.5px;color:var(--muted);margin-top:9px;display:flex;gap:7px;align-items:flex-start;line-height:1.55}
.confirm-actions{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}

/* delivery progress */
.delivery{display:flex;align-items:center;gap:0;margin:0 0 18px;padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);flex-wrap:wrap}
.dstep{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.dstep .b{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex:0 0 auto}
.dstep.done{color:var(--text)}
.dstep.done .b{background:var(--ok);border-color:var(--ok);color:var(--ok-fg)}
.dstep.now{color:var(--text-strong);font-weight:600}
.dstep.now .b{border-color:var(--accent);background:var(--accent-subtle);color:var(--accent)}
.dsep{flex:1;min-width:16px;height:1px;background:var(--border);margin:0 9px}

/* ============================================================
   WORKFLOW MAP — five phase swimlanes
   ============================================================ */
.map-wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.map-bar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--bg-accent);flex-wrap:wrap}
.map-scroll{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 20px 26px}
.lane{display:grid;grid-template-columns:158px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.lane:last-child{border-bottom:0}
.lane-h{display:flex;flex-direction:column;gap:5px;position:sticky;left:0}
.lane-h .nm{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-strong)}
.lane-h .bar{height:3px;border-radius:2px;background:var(--ph)}
.lane-h .sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
.stages{display:flex;gap:9px;flex-wrap:wrap}
.stage{
  position:relative;width:154px;text-align:left;padding:9px 11px;cursor:pointer;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
  border-top:2px solid var(--ph);color:var(--text)
}
.stage:hover{border-color:var(--border-hover);box-shadow:var(--shadow-sm)}
.stage[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stage .sn{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.stage .st{font-size:12.5px;font-weight:600;color:var(--text-strong);line-height:1.35;margin:1px 0 5px}
.stage .sm{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:10.5px;color:var(--muted)}
.stage[data-state="done"] .st{color:var(--muted-strong);font-weight:500}
.stage[data-state="skipped"]{opacity:.62;border-style:dashed;background:transparent}
.stage[data-state="current"]{background:var(--accent-subtle);border-color:var(--accent)}
.stage[data-state="gate"]{border-color:var(--warn);background:var(--warn-subtle)}
.stage .rel{position:absolute;top:-7px;right:-7px;font-size:9.5px;font-family:var(--mono);padding:1px 5px;border-radius:999px;border:1px solid var(--border-strong);background:var(--bg-elevated);color:var(--muted-strong)}
.stage.up .rel{border-color:var(--info);color:var(--info);background:var(--info-subtle)}
.stage.down .rel{border-color:var(--aim);color:var(--aim);background:var(--aim-subtle)}
.units{margin-top:9px;padding-left:12px;border-left:2px dashed var(--border-strong);display:flex;flex-direction:column;gap:6px}
.unit{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.inspector{width:340px;flex:0 0 auto;border-left:1px solid var(--border);background:var(--panel-strong);overflow:auto;padding:16px 18px}

/* ============================================================
   WIZARD — four steps
   ============================================================ */
.wiz{max-width:940px;margin:0 auto;padding:24px 24px 40px}
.steps{display:flex;align-items:center;gap:0;margin-bottom:22px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:var(--radius-md);background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;font-size:13px}
.step .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;font-family:var(--mono);font-size:11px;flex:0 0 auto}
.step.done{color:var(--text)}
.step.done .n{background:var(--ok);border-color:var(--ok);color:var(--ok-fg)}
.step.now{color:var(--text-strong);font-weight:600;background:var(--bg-elevated);border-color:var(--border)}
.step.now .n{border-color:var(--accent);background:var(--accent-subtle);color:var(--accent)}
.step-sep{flex:1;min-width:14px;height:1px;background:var(--border)}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-strong);margin-bottom:5px}
.field .help{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field textarea,.field select{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--bg-elevated);color:var(--text);font-size:13px
}
.field textarea{min-height:86px;resize:vertical}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px}
.pick{padding:11px 13px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);cursor:pointer;text-align:left;color:var(--text)}
.pick:hover{border-color:var(--border-hover)}
.pick.sel{border-color:var(--accent);background:var(--accent-subtle)}
.pick .pl{font-size:13px;font-weight:600;color:var(--text-strong)}
.pick .pd{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.matrix{display:flex;flex-direction:column;gap:10px}
.mrow{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:11px 13px}
.mrow .mh{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:12.5px;font-weight:600;color:var(--text-strong)}
.mstages{display:flex;flex-wrap:wrap;gap:7px}
.ms{display:flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--border);border-radius:999px;background:var(--bg-elevated);font-size:11.5px;cursor:pointer;color:var(--text)}
.ms input{accent-color:var(--accent);width:13px;height:13px;margin:0}
.ms.on{border-color:color-mix(in srgb,var(--accent) 50%,var(--border));background:var(--accent-subtle)}
.ms.locked{opacity:.6;cursor:not-allowed}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat .s{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:11px 13px}
.stat .s .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:5px}
.stat .s .v{font-family:var(--mono);font-size:19px;color:var(--text-strong);margin-top:3px}
.stat .s .q{font-size:11px;color:var(--muted);margin-top:2px}
.wiz-bar{display:flex;gap:10px;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap}

/* generic simple pages */
.page{padding:22px 28px 34px;max-width:1080px}
.page h1{margin:0 0 4px;font-size:20px;font-weight:600;color:var(--text-strong);letter-spacing:-.01em}
.page .lede{color:var(--muted);font-size:13px;margin:0 0 20px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.tbl th{text-align:left;padding:9px 13px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg-accent)}
.tbl td{padding:11px 13px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:78px 20px minmax(0,1fr);gap:11px;padding:9px 0;border-bottom:1px solid var(--border)}
.tl .t{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:2px}
.tl .m{display:grid;place-items:center;padding-top:2px}
.tl .src{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:3px}
.empty{padding:34px;text-align:center;color:var(--muted)}
.empty .et{font-size:14px;color:var(--text-strong);font-weight:600;margin:9px 0 4px}

.back-btn{display:none}

/* ============================================================
   RESPONSIVE — 390px list -> detail
   ============================================================ */
@media (max-width:1180px){
  .compare{grid-template-columns:minmax(0,1fr)}
  .inspector{width:294px}
}
@media (max-width:900px){
  .ac{grid-template-columns:minmax(0,1fr)}
  /* nav moves to its own scrollable row rather than disappearing — mobile still
     needs to reach Repos / Intents / Map / Activity / Settings. */
  .topbar{flex-wrap:wrap;height:auto;min-height:52px;padding:8px 12px;row-gap:8px}
  .nav{order:10;flex-basis:100%;margin-left:0;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .nav button{flex:0 0 auto}
  .queue{border-right:0}
  body[data-pane="detail"] .queue{display:none}
  body[data-pane="list"] .detail{display:none}
  body[data-pane="detail"] .back-btn{display:inline-flex}
  .detail-head{padding:14px 16px 0}
  .detail-body{padding:16px 16px 26px}
  .actionbar,.confirm{padding-left:16px;padding-right:16px}
  .confirm{margin-left:16px;margin-right:16px}
  .dtitle{font-size:19px}
  .inspector{display:none}
  .lane{grid-template-columns:minmax(0,1fr)}
  .lane-h{position:static}
  .stage{width:100%}
  .page{padding:16px}
  .wiz{padding:16px 16px 34px}
  .brand-hide{display:none}
  .scopebar{overflow-x:auto}
}
@media (max-width:430px){
  .topbar{padding:0 12px;gap:9px;padding-top:8px;padding-bottom:8px}
  #newIntentBtn .nlbl{display:none}
  .variant-tag{font-size:10px;padding:3px 7px}
  .dfacts{gap:6px}
  .tabs{gap:14px;overflow-x:auto}
  .actionbar .hint{display:none}
  .actionbar .btn{flex:1 1 auto;justify-content:center}
  .stat{grid-template-columns:repeat(2,minmax(0,1fr))}
  .advisor dl{grid-template-columns:minmax(0,1fr)}
  .advisor dt{padding-top:6px}
}
</style>
