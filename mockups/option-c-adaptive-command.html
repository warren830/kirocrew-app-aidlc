<!DOCTYPE html>
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-DLC Studio — Option C — Adaptive Command</title>
<style>
/* ============================================================
   AI-DLC Studio · Option C — Adaptive Command
   Self-contained mockup. No network assets. Inline SVG only.
   KiroCrew-native token surface with AI-DLC phase accents.
   ============================================================ */

/* ---- KiroCrew design tokens (dark default) ---- */
:root[data-theme="dark"]{
  --bg:#12141a; --bg-accent:#14161d; --bg-elevated:#1a1d25; --bg-hover:#262a35;
  --card:#181b22; --card-fg:#f4f4f5; --card-hl:rgba(255,255,255,.05);
  --panel:#12141a; --panel-strong:#1a1d25; --chrome:rgba(18,20,26,.95);
  --text:#e4e4e7; --text-strong:#fafafa; --muted:#7f7f88; --muted-strong:#a1a1aa;
  --border:#27272a; --border-strong:#3f3f46; --border-hover:#52525b;
  --accent:#00d492; --accent-fg:#000; --accent-hover:#34d399; --accent-subtle:rgba(4,117,88,.2);
  --ring:#10b981;
  --ok:#22c55e; --ok-fg:#000; --ok-subtle:rgba(34,197,94,.12);
  --warn:#eab308; --warn-fg:#000; --warn-subtle:rgba(234,179,8,.12);
  --danger:#ef4444; --danger-fg:#000; --danger-subtle:rgba(239,68,68,.12);
  --info:#22b8cf; --info-fg:#000; --info-subtle:rgba(34,184,207,.14);
  --aim:#a78bfa; --aim-subtle:rgba(167,139,250,.15);
  --shadow-sm:0 1px 2px rgba(0,0,0,.2);
  --shadow-md:0 4px 12px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.03);
  --shadow-lg:0 12px 28px rgba(0,0,0,.35);
  --kbd-bg:#22252e;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#fafafa; --bg-accent:#f5f5f5; --bg-elevated:#ffffff; --bg-hover:#f0f0f0;
  --card:#ffffff; --card-fg:#18181b; --card-hl:rgba(0,0,0,.03);
  --panel:#fafafa; --panel-strong:#f5f5f5; --chrome:rgba(250,250,250,.95);
  --text:#3f3f46; --text-strong:#18181b; --muted:#71717a; --muted-strong:#52525b;
  --border:#e4e4e7; --border-strong:#d4d4d8; --border-hover:#a1a1aa;
  --accent:#047558; --accent-fg:#fff; --accent-hover:#059669; --accent-subtle:rgba(4,117,88,.12);
  --ring:#047558;
  --ok:#16a34a; --ok-fg:#fff; --ok-subtle:rgba(22,163,74,.1);
  --warn:#a16207; --warn-fg:#fff; --warn-subtle:rgba(161,98,7,.1);
  --danger:#dc2626; --danger-fg:#fff; --danger-subtle:rgba(220,38,38,.1);
  --info:#0e7490; --info-fg:#fff; --info-subtle:rgba(14,116,144,.1);
  --aim:#7c3aed; --aim-subtle:rgba(124,58,237,.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04);
  --shadow-lg:0 12px 28px rgba(0,0,0,.12);
  --kbd-bg:#f1f1f3;
  color-scheme:light;
}
:root{
  --font-body:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-xl:16px;

  /* AI-DLC phase accents — Option C pushes these hardest of the three
     directions, but only through hue/edge treatment, never shape. */
  --ph-init:#8b93a7;      --ph-init-subtle:rgba(139,147,167,.16);
  --ph-ideation:#a78bfa;  --ph-ideation-subtle:rgba(167,139,250,.16);
  --ph-inception:#38bdf8; --ph-inception-subtle:rgba(56,189,248,.16);
  --ph-construction:#00d492; --ph-construction-subtle:rgba(0,212,146,.16);
  --ph-operation:#fb923c; --ph-operation-subtle:rgba(251,146,60,.16);
}
:root[data-theme="light"]{
  --ph-init:#5b6478;      --ph-init-subtle:rgba(91,100,120,.12);
  --ph-ideation:#7c3aed;  --ph-ideation-subtle:rgba(124,58,237,.12);
  --ph-inception:#0369a1; --ph-inception-subtle:rgba(3,105,161,.12);
  --ph-construction:#047558; --ph-construction-subtle:rgba(4,117,88,.12);
  --ph-operation:#c2410c; --ph-operation-subtle:rgba(194,65,12,.12);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-body); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--ring); outline-offset:2px; border-radius:4px}
button,input,select,textarea{font:inherit; color:inherit}
svg{display:block; flex:none}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

/* ---- primitives ---- */
.mono{font-family:var(--mono)}
.mut{color:var(--muted)}
.strong{color:var(--text-strong)}
.row{display:flex; align-items:center; gap:8px}
.wrap{flex-wrap:wrap}
.sp{flex:1 1 auto}
.tiny{font-size:11px}
.xs{font-size:12px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

kbd{
  font-family:var(--mono); font-size:10px; line-height:1; padding:3px 5px;
  background:var(--kbd-bg); border:1px solid var(--border-strong);
  border-bottom-width:2px; border-radius:4px; color:var(--muted-strong);
  min-width:16px; text-align:center; display:inline-block;
}
.btn{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  font-size:12px; padding:6px 11px; border-radius:var(--radius-md);
  background:var(--bg-elevated); color:var(--text);
  border:1px solid var(--border-strong); transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--bg-hover); border-color:var(--border-hover)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn-primary{background:var(--accent); color:var(--accent-fg); border-color:transparent; font-weight:600}
.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:var(--danger-subtle); color:var(--danger); border-color:var(--danger)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--muted-strong)}
.btn-ghost:hover{background:var(--bg-hover); color:var(--text)}
.btn-sm{padding:4px 8px; font-size:11px}

.chip{
  display:inline-flex; align-items:center; gap:5px; font-size:11px;
  padding:3px 8px; border-radius:999px; border:1px solid var(--border);
  background:var(--bg-accent); color:var(--muted-strong); white-space:nowrap;
}
.chip-on{background:var(--accent-subtle); border-color:var(--accent); color:var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.sev{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid}
.sev-critical{color:var(--danger);background:var(--danger-subtle);border-color:var(--danger)}
.sev-blocking{color:var(--warn);background:var(--warn-subtle);border-color:var(--warn)}
.sev-error{color:var(--danger);background:transparent;border-color:var(--border-strong)}
.sev-notice{color:var(--info);background:var(--info-subtle);border-color:var(--info)}

/* ---- app shell ---- */
.app{display:flex; flex-direction:column; height:100vh; overflow:hidden}

.topbar{
  display:flex; align-items:center; gap:10px; padding:8px 12px;
  background:var(--chrome); border-bottom:1px solid var(--border); flex:none;
  backdrop-filter:blur(8px);
}
.brand{display:flex; align-items:center; gap:8px; min-width:0}
.brand-mark{
  width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--ph-ideation),var(--ph-construction));
  color:#04120c;
}
.brand-name{font-weight:700; font-size:13px; color:var(--text-strong); white-space:nowrap}
.opt-tag{
  font-family:var(--mono); font-size:10px; letter-spacing:.05em; padding:3px 8px;
  border:1px dashed var(--accent); color:var(--accent); border-radius:999px;
  background:var(--accent-subtle); white-space:nowrap;
}

/* command bar: the signature of Option C */
.cmd{
  flex:1 1 420px; min-width:0; display:flex; align-items:center; gap:8px;
  background:var(--bg-elevated); border:1px solid var(--border-strong);
  border-radius:var(--radius-md); padding:5px 8px; position:relative;
}
.cmd:focus-within{border-color:var(--ring); box-shadow:0 0 0 3px var(--accent-subtle)}
.cmd input{
  flex:1 1 auto; min-width:60px; background:transparent; border:0; outline:0;
  font-size:12.5px; font-family:var(--mono);
}
.cmd input::placeholder{color:var(--muted)}
.cmd-token{
  font-family:var(--mono); font-size:11px; padding:2px 6px; border-radius:5px;
  background:var(--accent-subtle); color:var(--accent); border:1px solid var(--accent);
  display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
}
.cmd-token button{background:none;border:0;cursor:pointer;color:inherit;padding:0;line-height:1}

.palette{
  position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:60;
  background:var(--card); border:1px solid var(--border-strong);
  border-radius:var(--radius-md); box-shadow:var(--shadow-lg); overflow:hidden;
  max-height:340px; overflow-y:auto;
}
.palette-group{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  padding:8px 10px 4px}
.palette-item{
  display:flex;align-items:center;gap:9px;padding:7px 10px;cursor:pointer;font-size:12px;
  border-left:2px solid transparent;
}
.palette-item:hover,.palette-item[aria-selected="true"]{background:var(--bg-hover);border-left-color:var(--accent)}
.palette-item .p-hint{margin-left:auto;display:flex;gap:3px}

.theme-toggle{display:flex;border:1px solid var(--border-strong);border-radius:var(--radius-md);overflow:hidden}
.theme-toggle button{background:var(--bg-elevated);border:0;padding:6px 8px;cursor:pointer;color:var(--muted)}
.theme-toggle button[aria-pressed="true"]{background:var(--accent-subtle);color:var(--accent)}

/* scope + filter rail */
.railbar{
  display:flex;align-items:center;gap:8px;padding:6px 12px;flex:none;
  background:var(--bg-accent);border-bottom:1px solid var(--border);overflow-x:auto;
}
.scope{display:flex;align-items:center;gap:4px;font-size:11.5px}
.scope select{
  background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:3px 6px;font-size:11.5px;max-width:190px;
}
.scope-sep{color:var(--muted)}
.filters{display:flex;align-items:center;gap:6px}
.filters button{cursor:pointer}

/* collapsible status strip */
.strip{flex:none;background:var(--panel-strong);border-bottom:1px solid var(--border)}
.strip-head{
  display:flex;align-items:center;gap:10px;padding:6px 12px;cursor:pointer;
  background:none;border:0;width:100%;text-align:left;
}
.strip-head:hover{background:var(--bg-hover)}
.strip-caret{transition:transform .15s}
.strip[data-open="false"] .strip-caret{transform:rotate(-90deg)}
.strip-body{padding:2px 12px 10px;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(228px,1fr))}
.strip[data-open="false"] .strip-body{display:none}
.lane{
  border:1px solid var(--border);border-left:3px solid var(--lane-accent,var(--border-strong));
  border-radius:var(--radius-md);background:var(--card);padding:8px 9px;
}
.lane-bar{height:3px;border-radius:2px;background:var(--border);overflow:hidden;margin-top:7px}
.lane-bar>i{display:block;height:100%;background:var(--lane-accent,var(--accent))}
.pill-live{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ok)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pl 1.8s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}

/* view switch */
.views{display:flex;gap:2px;padding:6px 12px 0;flex:none;border-bottom:1px solid var(--border);
  background:var(--bg)}
.views button{
  background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px 8px;
  cursor:pointer;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px;
}
.views button[aria-selected="true"]{color:var(--text-strong);border-bottom-color:var(--accent);font-weight:600}
.views button:hover{color:var(--text)}

main{flex:1 1 auto; min-height:0; overflow:hidden}
.view{height:100%; overflow:hidden}

/* ---- Action Center: master / detail ---- */
.split{display:grid; grid-template-columns:36% 64%; height:100%; min-height:0}
.queue{border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0;
  background:var(--panel)}
.queue-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);flex:none}
.queue-list{overflow-y:auto; flex:1 1 auto; padding-bottom:16px}
.qgroup{border-bottom:1px solid var(--border)}
.qgroup-head{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
  background:var(--bg-accent);border:0;border-left:3px solid var(--g-accent,var(--border-strong));
  padding:6px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted-strong);position:sticky;top:0;z-index:2;
}
.qgroup-head:hover{background:var(--bg-hover)}
.qgroup[data-open="false"] .qgroup-items{display:none}
.qgroup[data-open="false"] .strip-caret{transform:rotate(-90deg)}
.qcount{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted)}

.qitem{
  display:block;width:100%;text-align:left;cursor:pointer;background:transparent;
  border:0;border-bottom:1px solid var(--border);border-left:3px solid transparent;
  padding:8px 10px 9px; position:relative;
}
.qitem:hover{background:var(--bg-hover)}
.qitem[aria-selected="true"]{background:var(--accent-subtle); border-left-color:var(--accent)}
.qitem[data-phase]::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--q-phase)}
.qitem[aria-selected="true"][data-phase]::after{background:var(--accent)}
.qtitle{font-size:12.5px;color:var(--text-strong);font-weight:600;margin:3px 0 2px}
.qmeta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:10.5px;color:var(--muted)}
.qkey{font-family:var(--mono);font-size:10px;padding:1px 4px;border:1px solid var(--border-strong);
  border-radius:3px;color:var(--muted);background:var(--kbd-bg)}
.qwait{font-family:var(--mono)}

/* ---- contextual inspector ---- */
.detail{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.detail-head{flex:none;padding:10px 14px 0;border-bottom:1px solid var(--border);background:var(--bg-accent)}
.crumbs{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11px;color:var(--muted)}
.crumbs b{color:var(--text-strong);font-weight:600}
.detail-title{font-size:15px;font-weight:700;color:var(--text-strong);margin:6px 0 4px}
.dtabs{display:flex;gap:2px;margin-top:8px}
.dtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;
  cursor:pointer;color:var(--muted);font-size:12px}
.dtabs button[aria-selected="true"]{color:var(--text-strong);border-bottom-color:var(--accent);font-weight:600}
.detail-body{flex:1 1 auto;overflow-y:auto;padding:14px}
.detail-foot{
  flex:none;border-top:1px solid var(--border);background:var(--chrome);
  padding:9px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  backdrop-filter:blur(8px);
}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:11px 12px;margin-bottom:11px}
.card-ph{border-left:3px solid var(--ph,var(--border-strong))}
.card h4{margin:0 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card p{margin:0 0 7px}
.card p:last-child{margin-bottom:0}
ul.tight{margin:0;padding-left:17px}
ul.tight li{margin-bottom:4px}
.crit{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--border)}
.crit:last-child{border-bottom:0}
.crit .ok{color:var(--ok)} .crit .no{color:var(--warn)}
.file{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--bg-elevated);margin-bottom:6px;cursor:pointer;font-size:12px}
.file:hover{border-color:var(--border-hover);background:var(--bg-hover)}
.file .mut{margin-left:auto;font-family:var(--mono);font-size:10.5px}
.finding{border-left:3px solid var(--warn);background:var(--warn-subtle);padding:8px 10px;
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin-bottom:8px}
.finding.blocking{border-left-color:var(--danger);background:var(--danger-subtle)}
.finding q{font-style:italic;color:var(--text-strong)}
.advisor{border:1px solid var(--aim);background:var(--aim-subtle);border-radius:var(--radius-md);
  padding:11px 12px;margin-bottom:11px}
.advisor-h{display:flex;align-items:center;gap:7px;color:var(--aim);font-weight:600;font-size:12px;margin-bottom:7px}
.conf{display:inline-flex;gap:2px;align-items:center}
.conf i{width:14px;height:5px;border-radius:2px;background:var(--border-strong)}
.conf i.on{background:var(--aim)}
.needsyou{color:var(--warn);font-weight:600}

.confirm{border:1px solid var(--accent);background:var(--accent-subtle);border-radius:var(--radius-md);
  padding:11px 12px;margin-bottom:11px}
.exact{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px dashed var(--border-strong);
  border-radius:var(--radius-sm);padding:8px 9px;margin:7px 0;white-space:pre-wrap;color:var(--text-strong)}

/* questions */
.qq{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);
  padding:11px 12px;margin-bottom:11px}
.qq-h{font-size:13px;font-weight:600;color:var(--text-strong);margin-bottom:3px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border:1px solid var(--border);
  border-radius:var(--radius-sm);margin-bottom:6px;cursor:pointer;background:var(--bg-elevated)}
.opt:hover{border-color:var(--border-hover)}
.opt.sel{border-color:var(--accent);background:var(--accent-subtle)}
.opt.draft{border-style:dashed;border-color:var(--aim)}
.opt input{margin-top:2px;accent-color:var(--accent)}
.opt .od{color:var(--muted);font-size:11.5px}
.otherbox{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:7px 8px;font-size:12px;resize:vertical;min-height:52px}

/* delivery meter */
.deliv{display:flex;align-items:center;gap:0;margin:9px 0 2px}
.deliv-step{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted)}
.deliv-step .dt{width:9px;height:9px;border-radius:50%;border:2px solid var(--border-strong)}
.deliv-step.done .dt{background:var(--ok);border-color:var(--ok)}
.deliv-step.now .dt{background:var(--warn);border-color:var(--warn)}
.deliv-line{flex:1 1 auto;height:1px;background:var(--border-strong);margin:0 7px}

/* timeline */
.tl{position:relative;padding-left:16px}
.tl::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:1px;background:var(--border)}
.tl-i{position:relative;padding:0 0 11px}
.tl-i::before{content:"";position:absolute;left:-15px;top:5px;width:7px;height:7px;border-radius:50%;
  background:var(--bg);border:2px solid var(--src,var(--border-strong))}
.src-tag{font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:3px;border:1px solid var(--src);
  color:var(--src)}

/* ---- Workflow Map ---- */
.map{height:100%;overflow:auto;padding:12px 14px}
.map-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.swim{margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;
  background:var(--card)}
.swim-h{display:flex;align-items:center;gap:9px;padding:7px 10px;background:var(--ph-subtle);
  border-left:4px solid var(--ph);cursor:pointer}
.swim-h b{color:var(--text-strong);font-size:12px}
.swim-body{display:flex;gap:8px;padding:10px;overflow-x:auto}
.swim[data-open="false"] .swim-body{display:none}
.st{
  flex:0 0 152px;border:1px solid var(--border);border-top:3px solid var(--ph);
  border-radius:var(--radius-sm);background:var(--bg-elevated);padding:8px;cursor:pointer;
  position:relative;
}
.st:hover{border-color:var(--border-hover)}
.st[aria-selected="true"]{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}
.st[data-state="skipped"]{opacity:.5;border-style:dashed;background:transparent}
.st[data-state="running"]{box-shadow:0 0 0 2px var(--ok)}
.st-n{font-size:11.5px;font-weight:600;color:var(--text-strong);margin-bottom:4px;line-height:1.3}
.st-m{font-size:10px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px}
.st.up{outline:2px dashed var(--info);outline-offset:1px}
.st.down{outline:2px dashed var(--ph-operation);outline-offset:1px}
.units{display:flex;gap:8px;padding:0 10px 10px 26px;overflow-x:auto;border-left:2px dotted var(--ph);
  margin-left:14px}
.inspector{border:1px solid var(--accent);border-radius:var(--radius-md);background:var(--card);
  padding:11px 12px;margin-bottom:12px}

/* ---- wizard ---- */
.wiz{height:100%;overflow-y:auto;padding:14px 16px;max-width:1080px;margin:0 auto}
.steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.step{flex:1 1 150px;border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 10px;
  background:var(--card);border-top:3px solid var(--border-strong)}
.step[data-on="true"]{border-top-color:var(--accent);background:var(--accent-subtle)}
.step[data-done="true"]{border-top-color:var(--ok)}
.step-n{font-family:var(--mono);font-size:10px;color:var(--muted)}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:var(--bg-elevated);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 9px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.matrix{display:grid;gap:7px;grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.mstage{border:1px solid var(--border);border-left:3px solid var(--ph);border-radius:var(--radius-sm);
  padding:7px 8px;background:var(--bg-elevated);font-size:11.5px}
.mstage.off{opacity:.5;border-style:dashed}
.mstage.locked{background:var(--bg-accent)}
.mstage input{accent-color:var(--accent)}
.mstage .why{font-size:10px;color:var(--muted);margin-top:3px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.kpi>div{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--card);padding:9px 10px}
.kpi .v{font-size:19px;font-weight:700;color:var(--text-strong);font-family:var(--mono)}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.exact-tag{color:var(--ok);font-size:9.5px;border:1px solid var(--ok);border-radius:3px;padding:0 4px}
.range-tag{color:var(--warn);font-size:9.5px;border:1px solid var(--warn);border-radius:3px;padding:0 4px}
.na-tag{color:var(--muted);font-size:9.5px;border:1px dashed var(--border-strong);border-radius:3px;padding:0 4px}
table.diff{width:100%;border-collapse:collapse;font-size:12px}
table.diff th,table.diff td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--border)}
table.diff th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

/* ---- toast + modal ---- */
.toasts{position:fixed;right:14px;bottom:14px;z-index:200;display:flex;flex-direction:column;gap:8px;
  max-width:340px}
.toast{background:var(--card);border:1px solid var(--border-strong);border-left:3px solid var(--accent);
  border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:9px 11px;font-size:12px}
.toast.warnt{border-left-color:var(--warn)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);max-width:560px;width:100%;padding:14px 15px;max-height:86vh;overflow-y:auto}
.help-k{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px;align-items:center}

/* ---- mobile / 390px ---- */
.back-btn{display:none}
@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .detail{display:none}
  .split[data-mobile="detail"] .queue{display:none}
  .split[data-mobile="detail"] .detail{display:flex}
  .back-btn{display:inline-flex}
  .cmd{flex:1 1 auto}
  .brand-name,.opt-tag{display:none}
  .grid2{grid-template-columns:1fr}
  .swim-body,.units{flex-direction:column}
  .st{flex:1 1 auto}
  .detail-body{padding:11px}
  .views{overflow-x:auto}
}
@media (max-width:420px){
  body{font-size:12.5px}
  .railbar{gap:6px}
  .scope select{max-width:112px}
  .kpi{grid-template-columns:1fr 1fr}
}

  if(state.filters.size) list = list.filter(a => state.filters.has(a.type));
  state.tokens.forEach(t => {
    if(t.k === 'repo') list = list.filter(a => a.repo === t.v);
    if(t.k === 'type') list = list.filter(a => a.type === t.v);
    if(t.k === 'text') list = list.filter(a =>
      [REPOS[a.repo].label, a.intent, a.stage, TYPE[a.type].n, a.title, a.id]
        .join(' ').toLowerCase().includes(t.v.toLowerCase()));

  if(state.groupBy === 'priority')

<script>

<script>
/* ================= interactions ================= */
function labelOf(q, v){
  if(v === '__other') return 'Other: ' + (state.answers[q.id+'_other'] || '(empty)');
  const o = q.opts.find(x => x.v === v);
  return o ? o.l : v;
}
function qPreviewText(){
  return QSET.map((q,i) => {
    const a = state.answers[q.id];
    let val = '—';
    if(q.mode === 'single' && a) val = labelOf(q, a);
    if(q.mode === 'multi' && a && a.size) val = [...a].map(v => labelOf(q, v)).join(', ');
    return `${i+1}. ${q.head}: ${val}`;
  }).join('\n');
}
function refreshPreview(){
  const p = $('#qPreview'); if(p) p.textContent = qPreviewText();
}

function wireDetail(a){
  const bind = (sel, fn) => $$('#detail ' + sel).forEach(el => el.onclick = fn);

  $$('#detail [data-qid]').forEach(inp => inp.onchange = () => {
    const qid = inp.dataset.qid;
    if(inp.dataset.mode === 'single') state.answers[qid] = inp.value;
    else {
      const set = state.answers[qid] instanceof Set ? state.answers[qid] : new Set();
      inp.checked ? set.add(inp.value) : set.delete(inp.value);
      state.answers[qid] = set;
    }
    renderDetail();
  });
  $$('#detail [data-other]').forEach(t => t.oninput = () => {
    state.answers[t.dataset.other + '_other'] = t.value; refreshPreview();
  });
  refreshPreview();

  $$('#detail [data-adv]').forEach(b => b.onclick = () => {
    const kind = b.dataset.adv;
    if(kind === 'gate'){
      state.advisor[a.id] = a.adv || {conf:2, rec:'No blocking defect found in this revision.',
        why:'Every acceptance criterion is satisfied and the single open finding is advisory.',
        assume:'The advisory finding is acceptable to carry into the next stage.',
        alt:'Request changes to close the finding inside this stage instead.',
        undec:'whether the open advisory finding meets your review bar.'};
    } else if(kind === 'diagnose'){
      state.advisor[a.id] = {conf:2, rec:'Transport-level fault, not a code defect.',
        why:'All three failures share one fingerprint and no artifact changed between them, which is the transient signature rather than a deterministic guard.',
        assume:'The ACP peer was restarted or rate-limited during the window.',
        alt:'Retry once now; if a fourth attempt matches the same fingerprint, pause the intent instead of retrying again.',
        undec:'whether to spend another turn on a retry before pausing.'};
      renderDetail(); toast('Advisor diagnosis ready. It is a draft — you still decide.'); return;
    } else if(kind === 'explain'){
      toast('Advisor: question 1 sets FR-ACT-005\u2019s default. Unified priority matches the tier contract; the grouped options trade cross-repo urgency for per-repo focus.');
      return;
    } else {
      state.advisor[a.id] = {conf:3, rec:'Drafted: unified priority · four blocking sources · Advisor on request only.',
        why:'Unified priority matches the FR-ACT-003 tier contract. Maintenance upgrades are excluded because FR-ACT-008 keeps them out of the blocking queue. Pre-fetching the Advisor would contradict FR-ADV-001.',
        assume:'Maintenance notices are acceptable on Repos and in notifications only.',
        alt:'Group by repo, if you routinely work one repository at a time.',
        undec:'whether excluding maintenance from the queue matches how your team triages.'};
    }
    renderDetail();
    toast('Advisor draft ready. It is a draft — nothing is submitted and Approve is not preselected.');
  });

  bind('[data-do="approve"]', () => { state.confirmGate = true; renderDetail();
    $('#gateConfirm') && $('#gateConfirm').scrollIntoView({block:'center'}); });
  bind('[data-do="approve-cancel"]', () => { state.confirmGate = false; renderDetail(); });
  bind('[data-do="approve-confirm"]', () => {
    state.resolved.add(a.id); state.confirmGate = false;
    toast('Sent <b>'+esc(a.gateText)+'</b> into <span class="mono">'+esc(a.session)+'</span> as a real user turn. Waiting for AI-DLC state movement before this item clears.');
    setTimeout(()=>toast('State changed: <span class="mono">HUMAN_TURN</span> minted, gate <span class="mono">'+esc(a.stage)+'</span> cleared by the engine.'), 900);
    renderViews(); renderQueue(); renderStrip();
  });
  bind('[data-do="changes"]', () => {
    if($('#changesBox')){ $('#changesBox textarea').focus(); return; }
    const div = document.createElement('div');
    div.className = 'confirm'; div.id = 'changesBox';
    div.innerHTML = `<b class="strong xs">Request changes</b>
      <p class="tiny mut" style="margin:6px 0">Feedback cannot be blank. It is sent to the canonical
        session as a real user turn; the gate becomes <span class="mono">[R]</span> and the same session
        revises the artifact.</p>
      <textarea class="otherbox" placeholder="What must change before you can approve?"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn btn-primary btn-sm" id="sendChanges" disabled>Send feedback</button>
        <span class="tiny mut">Studio does not edit the artifact.</span></div>`;
    $('#detailBody').appendChild(div); div.scrollIntoView({block:'center'});
    const ta = div.querySelector('textarea'), btn = div.querySelector('#sendChanges');
    ta.oninput = () => btn.disabled = !ta.value.trim();
    ta.focus();
    btn.onclick = () => { state.resolved.add(a.id);
      toast('Feedback delivered. Gate is now <span class="mono">[R]</span> — the same session will revise the artifact and the gate reopens.', 'warn');
      renderViews(); renderQueue(); };
  });
  bind('[data-do="send"]', () => {
    const missing = QSET.filter(q => q.req).filter(q => {
      const v = state.answers[q.id];
      return q.mode === 'single' ? !v : !(v && v.size);
    });
    if(missing.length){
      toast('Required answer missing: <b>'+esc(missing.map(m=>m.head).join(', '))+'</b>. All required answers must be present before submit.', 'warn');
      return;
    }
    state.resolved.add(a.id);
    toast('One atomic submission sent under action id <span class="mono">'+esc(a.id)+'</span> — three answers, one digest, one human turn.');
    renderViews(); renderQueue();
  });
  bind('[data-do="reconcile"]', () => toast('Reconciling: session status, AI-DLC state, audit events, active directive, turn marker and the action timeline. Read-only — nothing is replayed.'));
  bind('[data-do="replace"]', () => toast('Session replacement needs your confirmation: the directive is still open mid-stage, so automatic failover is not eligible.', 'warn'));
  bind('[data-do="retry"]', () => toast('Retry dispatched under the repo lease. The fingerprint count resets only after a relevant change or this explicit retry.'));
  bind('[data-do="pause"]', () => toast('Pause after current turn: no future dispatch, the current turn finishes. Force stop is separate and needs confirmation.', 'warn'));
  bind('[data-do="rescan"]', () => toast('Preflight re-run: 2 managed files still drifted. Install stays blocked and the prior installation is untouched.', 'warn'));
  bind('[data-do="diffview"]', () => { state.tab = 'artifacts'; renderDetail(); });
  bind('[data-do="resume"]', () => toast('Manual resume queued. Raising a cap never resumes automatically — you start the next turn.'));
  bind('[data-do="cap"]', () => toast('Turn cap is editable in Settings. Credit caps stay disabled while credits are not observable on this host.'));
  bind('[data-do="snooze"]', () => toast('Kept in the queue. Unsent drafts are preserved locally and you are warned before discarding them.'));
}

            <b>dependencies</b> to overlay this stage's relationships.</p>`}

    ${PHASES.map(p => {

        style="--ph:var(${p.v});--ph-subtle:var(${p.v}-subtle)">
        <div class="swim-h" role="button" tabindex="0" aria-expanded="${open}">

              ${state.mapDensity!=='overview'?`<span>${esc(s.ag)}</span><span>${esc(s.rev)}</span>`:''}
            </div>
          </div>`).join('')}</div>
        ${p.id==='construction' && open ? `<div class="units" aria-label="Construction unit sub-lanes">
          ${['unit-1 queue-projection','unit-2 detail-shell','unit-3 action-broker','unit-4 slack-quick-actions']
            .map((u,i) => `<div class="st" data-state="pending" style="--ph:var(--ph-construction)">
              <div class="st-n">${esc(u)}</div>
              <div class="st-m"><span>Pending</span><span>3.2 · 3.3 · 3.4</span></div></div>`).join('')}
        </div>` : ''}
      </section>`;
    }).join('')}
    <p class="tiny mut">A list/table alternative to these swimlanes is available for assistive technology;
      mobile uses phase accordions rather than a shrink-to-fit canvas.</p>`;

  $$('#mapRoot [data-den]').forEach(b => b.onclick = () => { state.mapDensity = b.dataset.den; renderMap(); });
  $$('#mapRoot [data-st]').forEach(el => {
    el.onclick = () => { state.mapSel = el.dataset.st; renderMap(); };
    el.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); } };
  });
  $$('#mapRoot .swim-h').forEach(h => {
    const toggle = () => {
      const id = 'sw_' + h.closest('.swim').dataset.sw;
      state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id);
      renderMap();
    };
    h.onclick = toggle;
    h.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } };
  });
  const jump = $('#mapRoot [data-jump]');
  if(jump) jump.onclick = () => { go('actions'); select(jump.dataset.jump); };
}

<script>
/* ================= four-step new-intent wizard ================= */
const WSTEPS = [

function planCounts(){

}
function renderWizard(){

  $('#wizRoot').innerHTML = `

    ${state.wizStep===1 ? `
    <div class="card"><h4>Step 1 · Work</h4>

    </div>` : ''}

    ${state.wizStep===2 ? `
    <div class="card"><h4>Step 2 · Preset</h4>

          <select><option>feature</option><option>mvp</option><option>bugfix</option><option>security-patch</option></select></div>

      </div>

    ${state.wizStep===3 ? `

        <div style="margin-bottom:11px">

                <span><span class="mono tiny mut">${esc(s.id)}</span> ${esc(s.n)}</span></span>
              <div class="why">${locked ? 'Locked — required or already at/behind the cursor'
                : s.gate ? 'human gate' : 'optional in this scope'}</div>
            </label>`; }).join('')}</div>
        </div>`).join('')}
      <p class="tiny mut">Dependency validation runs on every change. v1 does not author new stage
        definitions and does not reorder the DAG.</p>
    </div>` : ''}

    ${state.wizStep===4 ? `
    <div class="card"><h4>Step 4 · Review</h4>
      <div class="kpi" style="margin-bottom:11px">
        <div><div class="l">Stages <span class="exact-tag">exact</span></div><div class="v">${c.stages}</div>
          <div class="tiny mut">of ${c.total} known</div></div>
        <div><div class="l">Human gates <span class="exact-tag">exact</span></div><div class="v">${c.gates}</div></div>
        <div><div class="l">Artifacts <span class="exact-tag">exact</span></div><div class="v">${c.artifacts}</div></div>
        <div><div class="l">Turns <span class="range-tag">range</span></div><div class="v">58–96</div>
          <div class="tiny mut">rule-based · low confidence</div></div>
        <div><div class="l">Active time <span class="range-tag">range</span></div><div class="v">6–11h</div>
          <div class="tiny mut">calibrated from 3 local runs</div></div>
        <div><div class="l">Credits <span class="na-tag">unavailable</span></div><div class="v mut">—</div>
          <div class="tiny mut">not observable on this host</div></div>
      </div>
      <h4>Plan diff vs preset default</h4>
      <table class="diff"><thead><tr><th>Change</th><th>Effect</th></tr></thead><tbody>
        <tr><td class="mono">1.4 rough-mockups → skipped</td><td>Removes 1 stage, 0 gates. Loses early UI validation.</td></tr>
        <tr><td class="mono">3.6 refined-mockups → skipped</td><td>Removes 1 stage. Acceptable for an API-only change.</td></tr>
        <tr><td class="mono">2.4 nfr-design review → adversarial</td><td>Adds 1 reviewer cycle; dominates the upper estimate.</td></tr>
      </tbody></table>
      <p class="tiny mut" style="margin-top:8px"><b class="strong">Dominant cost:</b> 3.2 code-generation and
        3.4 build-and-test across 4 units account for roughly 60% of the range. Removing 3.3 contract-tests
        would cut ~1.5h and lose contract regression coverage.</p>
      <h4 style="margin-top:11px">Gates you will be asked to decide</h4>
      <div class="row wrap">${Object.values(MAP).flat().filter(s=>s.gate && !state.planOff.has(s.id))
        .map(s=>`<span class="chip tiny mono">${esc(s.id)}</span>`).join('')}</div>
    </div>` : ''}

    <div class="row wrap" style="margin:4px 0 24px">
      <button class="btn" id="wizPrev" ${state.wizStep===1?'disabled':''}>Back</button>
      ${state.wizStep<4
        ? `<button class="btn btn-primary" id="wizNext">Continue to step ${state.wizStep+1}</button>`
        : `<button class="btn btn-primary" id="wizCreate">Create intent (paused)</button>
           <button class="btn" id="wizRun" disabled title="Available after the intent exists on disk">Run to next checkpoint</button>`}
      <span class="sp"></span>
      <span class="tiny mut">Create verifies the new intent on disk before reporting success.</span>
    </div>`;

  $$('#wizRoot [data-plan]').forEach(cb => cb.onchange = () => {
    cb.checked ? state.planOff.delete(cb.dataset.plan) : state.planOff.add(cb.dataset.plan);
    renderWizard();
  });
  const prev = $('#wizPrev'), next = $('#wizNext');
  if(prev) prev.onclick = () => { state.wizStep = Math.max(1, state.wizStep-1); renderWizard(); };
  if(next) next.onclick = () => { state.wizStep = Math.min(4, state.wizStep+1); renderWizard(); };
  const cr = $('#wizCreate');
  if(cr) cr.onclick = () => {
    toast('Intent created through the canonical conversation and verified on disk. It is paused — nothing runs until you press <b>Run to next checkpoint</b>.');
    toast('It inherits no <span class="mono">Keep moving</span>, no budgets and no Advisor drafts from another intent.');
  };
}

/* ================= repos ================= */

    {r:'kirocrew-app-aidlc', p:'~/warren_ws/kirocrew-app-aidlc', s:'Healthy · engine 2.4.0',

/* ================= command palette ================= */
const CMDS = [
  {g:'Go',     l:'Action Center',        h:['1'], run:()=>go('actions')},
  {g:'Go',     l:'Workflow Map',         h:['2'], run:()=>go('map')},
  {g:'Go',     l:'New intent wizard',    h:['3'], run:()=>go('new')},
  {g:'Go',     l:'Repos',                h:['4'], run:()=>go('repos')},
  {g:'Filter', l:'type:gate',            h:['G'], run:()=>addToken('type','gate')},
  {g:'Filter', l:'type:questions',       h:[],    run:()=>addToken('type','questions')},
  {g:'Filter', l:'type:recovery',        h:[],    run:()=>addToken('type','recovery')},
  {g:'Filter', l:'repo:payments-api',    h:[],    run:()=>addToken('repo','payments')},
  {g:'Filter', l:'repo:edge-telemetry',  h:[],    run:()=>addToken('repo','edge')},
  {g:'Filter', l:'repo:kirocrew-app-aidlc', h:[], run:()=>addToken('repo','studio')},
  {g:'Run',    l:'Run to next checkpoint (kirocrew-app-aidlc)', h:['R'],
   run:()=>toast('Queued under the repo lease. It advances unattended until a gate, question, failure, budget stop or completion.')},
  {g:'Run',    l:'Pause after current turn (payments-api)', h:[],
   run:()=>toast('Pause armed. The current turn finishes; no further dispatch.', 'warn')},
  {g:'Run',    l:'Force stop now (payments-api)', h:[],
   run:()=>toast('Force stop needs a separate confirmation and marks the intent Interrupted. The scheduler never calls it.', 'warn')},
  {g:'View',   l:'Toggle execution strip', h:['E'], run:()=>$('#stripToggle').click()},
  {g:'View',   l:'Switch theme',           h:['T'], run:()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
];
function addToken(k,v){
  if(!state.tokens.some(t=>t.k===k&&t.v===v)) state.tokens.push({k,v});
  renderTokens(); go('actions'); renderQueue();
}
function renderTokens(){
  $('#cmdTokens').innerHTML = state.tokens.map((t,i) =>
    `<span class="cmd-token">${esc(t.k)}:${esc(t.v)}<button data-tok="${i}" aria-label="Remove filter">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button></span>`).join('');
  $$('#cmdTokens [data-tok]').forEach(b => b.onclick = () => {
    state.tokens.splice(+b.dataset.tok,1); renderTokens(); renderQueue(); });
}
let palIdx = 0;
function openPalette(q){
  const items = CMDS.filter(c => (c.g+' '+c.l).toLowerCase().includes((q||'').toLowerCase()));
  const pal = $('#palette');
  if(!items.length){ pal.hidden = true; $('#cmdInput').setAttribute('aria-expanded','false'); return; }
  palIdx = Math.min(palIdx, items.length-1);
  let html = '', last = '';
  items.forEach((c,i) => {
    if(c.g !== last){ html += `<div class="palette-group">${esc(c.g)}</div>`; last = c.g; }
    html += `<div class="palette-item" role="option" data-i="${i}" aria-selected="${i===palIdx}">
      <span>${esc(c.l)}</span><span class="p-hint">${c.h.map(k=>`<kbd>${k}</kbd>`).join('')}</span></div>`;
  });
  pal.innerHTML = html; pal.hidden = false;
  $('#cmdInput').setAttribute('aria-expanded','true');
  $$('#palette .palette-item').forEach(el => el.onclick = () => { items[+el.dataset.i].run(); closePalette(); });
  pal._items = items;
}
function closePalette(){
  $('#palette').hidden = true; $('#cmdInput').value = ''; palIdx = 0;
  $('#cmdInput').setAttribute('aria-expanded','false');
}
const ci = $('#cmdInput');
ci.oninput = () => {
  const v = ci.value;
  const m = v.match(/^(repo|type):(\S+)\s$/);
  if(m){ addToken(m[1], m[2]); ci.value = ''; closePalette(); return; }
  palIdx = 0; openPalette(v);
};
ci.onfocus = () => openPalette(ci.value);
ci.onkeydown = e => {
  const pal = $('#palette'), items = pal._items || [];
  if(e.key === 'ArrowDown'){ e.preventDefault(); palIdx = Math.min(items.length-1, palIdx+1); openPalette(ci.value); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); palIdx = Math.max(0, palIdx-1); openPalette(ci.value); }
  else if(e.key === 'Enter'){
    e.preventDefault();
    if(items[palIdx]) items[palIdx].run();
    else if(ci.value.trim()){ addToken('text', ci.value.trim()); }
    closePalette();
  } else if(e.key === 'Escape'){ e.preventDefault(); closePalette(); ci.blur(); }
  else if(e.key === 'Backspace' && !ci.value && state.tokens.length){
    state.tokens.pop(); renderTokens(); renderQueue();
  }
};
document.addEventListener('click', e => {
  if(!$('#cmd').contains(e.target)) $('#palette').hidden = true;
});

/* ================= keyboard layer ================= */
function helpModal(){
  const rows = [
    ['/ or ⌘K','Focus the command bar'],['1 – 4','Switch primary view'],
    ['J / K','Move down / up the queue'],['↵','Open the selected item'],
    ['1 – 7 (queue)','Jump to the numbered item'],['D A R V','Decision · Artifacts · Review · Activity tab'],
    ['G','Ask the Advisor for a draft'],['⌘↵','Primary action (Approve / Send answers)'],
    ['E','Collapse or expand the execution strip'],['M','Cycle Workflow Map density'],
    ['T','Switch light / dark theme'],['Esc','Close palette, modal, or confirmation'],['?','This reference']
  ];
  $('#modalRoot').innerHTML = `<div class="modal-bg" id="mb"><div class="modal" role="dialog" aria-modal="true" aria-label="Keyboard reference">
    <div class="row"><b class="strong">Keyboard reference</b><span class="sp"></span>
      <button class="btn btn-ghost btn-sm" id="mClose">Close <kbd>Esc</kbd></button></div>
    <p class="tiny mut" style="margin:8px 0 11px">Option C is keyboard-first: every control is also reachable
      by Tab in a predictable order, and focus rings use KiroCrew tokens.</p>
    <div class="help-k">${rows.map(r=>`<kbd>${esc(r[0])}</kbd><span class="xs">${esc(r[1])}</span>`).join('')}</div>
  </div></div>`;
  const close = () => $('#modalRoot').innerHTML = '';
  $('#mClose').onclick = close;
  $('#mb').onclick = e => { if(e.target.id === 'mb') close(); };
}
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)){ e.preventDefault(); ci.focus(); return; }
  if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
    const b = $('#detail .detail-foot .btn-primary'); if(b){ e.preventDefault(); b.click(); } return;
  }
  if(e.key === 'Escape'){
    if($('#modalRoot').innerHTML) $('#modalRoot').innerHTML = '';
    else if(state.confirmGate){ state.confirmGate = false; renderDetail(); }
    return;
  }
  if(typing) return;
  if(e.key === '/'){ e.preventDefault(); ci.focus(); return; }
  if(e.key === '?'){ e.preventDefault(); helpModal(); return; }
  if('1234'.includes(e.key) && !e.shiftKey && state.view !== 'actions'){ go(VIEWS[+e.key-1].id); return; }
  if(state.view === 'actions'){
    const list = visibleActions();
    const hit = list.find(a => a.key === e.key);
    if(hit){ select(hit.id); return; }
    if(e.key === 'j' || e.key === 'k'){
      e.preventDefault();
      const i = list.findIndex(a => a.id === state.sel);
      const n = e.key === 'j' ? Math.min(list.length-1, i+1) : Math.max(0, i-1);
      if(list[n]) select(list[n].id);
      return;
    }
    const tab = {d:'decision', a:'artifacts', r:'review', v:'activity'}[e.key];
    if(tab){ state.tab = tab; renderDetail(); return; }
    if(e.key === 'g'){ const b = $('#detail [data-adv]'); if(b) b.click(); return; }
  }
  if(e.key === 'e'){ $('#stripToggle').click(); return; }
  if(e.key === 't'){ setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); return; }
  if(e.key === 'm' && state.view === 'map'){
    const order = ['overview','detailed','dependencies'];
    state.mapDensity = order[(order.indexOf(state.mapDensity)+1) % 3]; renderMap(); return;
  }
  if('1234'.includes(e.key) && e.shiftKey) go(VIEWS[+e.key-1].id);
});

/* ================= init ================= */
$('#btnHelp').onclick = helpModal;
$('#groupBy').onchange = e => { state.groupBy = e.target.value; renderQueue(); };
['#scopeRepo','#scopeSpace','#scopeIntent'].forEach(s => $(s).onchange = () => { renderQueue(); renderStrip(); });
renderStrip(); renderViews(); renderFilters(); renderTokens(); renderQueue();
</script>
</body>
